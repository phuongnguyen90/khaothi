<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khảo thí CLO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: thanh điều hướng trái cố định + vùng làm việc; pastel tươi, viền đậm, bóng đổ khối */
:root{
  --bg:#F3F8FF; --bg2:#E2EFFF; --surface:#FFFFFF; --sunk:#EFF5FC;
  --ink:#15304F; --ink2:#3D587A; --ink3:#6A809E; --line:#C3D5EA; --hair:#E1EBF6;
  --berry:#D9578A; --berry-s:#FCE3EE;
  --sky:#2A74C9; --sky-s:#DCEBFC;
  --mint:#1E9A74; --mint-s:#D6F2E8;
  --lemon:#FFD565; --lemon-s:#FFF5D4;
  --grape:#7766D2; --grape-s:#ECE8FC;
  --peach:#E9844B; --peach-s:#FFE9DA;
  --bad:#D2404C; --bad-s:#FDE2E4;
  --block:0 1px 0 rgba(42,116,201,.10),0 8px 20px -10px rgba(21,48,79,.22);
  --block-sm:0 1px 0 rgba(42,116,201,.08),0 4px 10px -6px rgba(21,48,79,.20);
  --f:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17142B; --bg2:#1F1A3A; --surface:#231F40; --sunk:#1B1833;
  --ink:#F6F2FF; --ink2:#C3BCE6; --ink3:#7D76A8; --line:#0B0918; --hair:#36305C;
  --berry-s:#4A1E35; --sky-s:#1C2D55; --mint-s:#123D33; --lemon-s:#463A10; --grape-s:#33275E; --peach-s:#4A2A17; --bad-s:#4D1C20;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17142B; --bg2:#1F1A3A; --surface:#231F40; --sunk:#1B1833;
  --ink:#F6F2FF; --ink2:#C3BCE6; --ink3:#7D76A8; --line:#0B0918; --hair:#36305C;
  --berry-s:#4A1E35; --sky-s:#1C2D55; --mint-s:#123D33; --lemon-s:#463A10; --grape-s:#33275E; --peach-s:#4A2A17; --bad-s:#4D1C20;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:var(--f);font-size:14.5px;line-height:1.55;color:var(--ink);
  background:var(--bg);background-image:radial-gradient(circle at 12% 0%,var(--bg2) 0,transparent 42%),radial-gradient(circle at 100% 100%,var(--sky-s) 0,transparent 35%);background-attachment:fixed}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance;font-weight:800;letter-spacing:-.01em}
h1{font-size:28px} h2{font-size:21px} h3{font-size:16.5px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:20px 16px;display:flex;flex-direction:column;gap:18px;border-right:2px solid var(--line);background:var(--surface)}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);box-shadow:var(--block-sm);display:grid;place-items:center;font-weight:900;background:var(--lemon);color:#1E1B3A;font-size:15px}
.brand b{display:block;font-size:15px;font-weight:800}
.brand small{color:var(--ink2);font-size:12px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:600;color:var(--ink2);border:2px solid transparent}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--berry-s);color:var(--ink);border-color:var(--line);box-shadow:var(--block-sm)}
.nav .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:none}
.nav .count{margin-left:auto;font-size:11.5px;background:var(--berry);color:#fff;border-radius:99px;padding:1px 8px;font-weight:700}
.ctx{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px solid var(--line);border-radius:var(--r);background:var(--lemon-s);box-shadow:var(--block-sm)}
.ctx select.in{padding:7px 10px;font-weight:700;font-size:13px}
.ctx .nav button.on{background:var(--surface)}
.side{overflow-y:auto}
.clomini{display:flex;gap:6px;align-items:flex-end;height:46px}
.clomini>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;min-width:0}
.clomini i{display:block;width:100%;border:1.5px solid var(--line);border-radius:5px 5px 2px 2px;max-height:calc(100% - 16px)}
.clomini span{font-size:10.5px;font-weight:700;color:var(--ink2)}
.me{margin-top:auto;padding:12px;border:2px solid var(--line);border-radius:var(--r);background:var(--sunk);display:flex;flex-direction:column;gap:8px}
.me b{font-size:13.5px}
.main{min-width:0;padding-block:26px 60px;padding-inline:clamp(16px,3.2vw,40px)}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.top .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.mobilebar{display:none}

/* ---------- Primitives ---------- */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--block);padding:18px;min-width:0}
.card.flat{box-shadow:none}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;box-shadow:var(--block-sm);transition:transform .08s,box-shadow .08s;white-space:nowrap;color:var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--line)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.pri{background:var(--berry);color:#fff}
.btn.sky{background:var(--sky);color:#fff}
.btn.mint{background:var(--mint);color:#fff}
.btn.lemon{background:var(--lemon);color:#1E1B3A}
.btn.ghost{box-shadow:none;border-color:var(--hair)}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;border:1.5px solid var(--line);white-space:nowrap;color:var(--ink)}
.c-berry{background:var(--berry-s)} .c-sky{background:var(--sky-s)} .c-mint{background:var(--mint-s)} .c-lemon{background:var(--lemon-s)} .c-grape{background:var(--grape-s)} .c-peach{background:var(--peach-s)} .c-bad{background:var(--bad-s)} .c-plain{background:var(--sunk)}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .v{font-size:32px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:12.5px;color:var(--ink2);font-weight:600}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px;min-width:0}
.in,select.in,textarea.in{width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
textarea.in{resize:vertical;min-height:90px;line-height:1.55}
.in:focus{outline:none;box-shadow:var(--block-sm);border-color:var(--sky)}
.code,.in.code,textarea.in.code,pre.in.code{font-family:var(--mono);font-size:13.5px;line-height:1.6;tab-size:4;background:#1E1B3A;color:#F6F2FF;caret-color:#FFD34D;border-color:var(--line)}
textarea.in.code::placeholder{color:#9A94BC}
textarea.in.code::selection{background:#3B82F6;color:#fff}
.hint{font-size:12.5px;color:var(--ink2)}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 11px;text-align:left;border-bottom:1.5px solid var(--hair);vertical-align:middle}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);background:var(--sunk);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.c,th.c{text-align:center} td.r,th.r{text-align:right}
tbody tr:hover td{background:color-mix(in srgb,var(--sky-s) 35%,transparent)}
tfoot td{background:var(--sunk);font-weight:700;border-top:2px solid var(--line)}
.empty{padding:34px;text-align:center;color:var(--ink2);border:2px dashed var(--hair);border-radius:var(--r)}
.bar{height:10px;border-radius:99px;background:var(--sunk);border:1.5px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:99px;font-weight:700;font-size:13px;border:2px solid var(--hair);color:var(--ink2)}
.tabs button.on{border-color:var(--line);background:var(--lemon-s);color:var(--ink);box-shadow:var(--block-sm)}
.sep{height:2px;background:var(--hair);border:0;margin:4px 0}

/* ---------- Đề thi ---------- */
.qcard{border:2px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:2px solid var(--line);background:var(--sunk)}
.qhead b{font-size:15px}
.qbody{padding:14px;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:8px;padding:0 14px 14px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:2px solid var(--hair);border-radius:10px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--sky)}
.opt.sel{border-color:var(--line);background:var(--sky-s);box-shadow:var(--block-sm)}
.opt.right{border-color:var(--mint);background:var(--mint-s)}
.opt .L{font-weight:800;width:22px;flex:none}
.tests{font-family:var(--mono);font-size:12.5px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:0 14px 14px}
.tests span{color:var(--ink2)}
.legend{font-family:var(--mono);font-size:12.5px;background:var(--sunk);border:2px dashed var(--hair);border-radius:10px;padding:12px;white-space:pre;overflow-x:auto;line-height:1.6}

/* ---------- Làm bài ---------- */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px;align-items:start}
.panel{position:sticky;top:16px;display:flex;flex-direction:column;gap:14px}
.timer{font-size:34px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:var(--r);background:var(--mint-s);box-shadow:var(--block)}
.timer.warn{background:var(--lemon-s)} .timer.crit{background:var(--bad-s);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.qnav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qnav button{aspect-ratio:1;max-width:100%;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-weight:800;cursor:pointer;font-size:12.5px;padding:0}
.qnav button.done{background:var(--mint-s)}
.qnav button.cur{background:var(--berry);color:#fff}

/* ---------- Bài làm: ảnh, bảng vẽ, khóa ---------- */
.dropzone{padding:14px;border:2px dashed var(--sky);border-radius:12px;background:color-mix(in srgb,var(--sky-s) 55%,transparent);text-align:center;color:var(--ink2);font-size:13px}
.attach{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.attach figure{margin:0;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.attach img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#fff;cursor:zoom-in;border-bottom:2px solid var(--line)}
.attach figcaption{display:flex;gap:6px;align-items:center;padding:6px;flex-wrap:wrap}
.sk .sktools{display:flex;flex-wrap:wrap;gap:6px}
.sk .sktools button{padding:6px 11px;border:2px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.sk .sktools button.on{background:var(--lemon);color:#1E1B3A;box-shadow:var(--block-sm)}
.sk .skopts{gap:10px;padding:8px 10px;border:2px solid var(--hair);border-radius:12px;background:var(--sunk);font-size:13px}
.sk .skopts .in{padding:4px 8px}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch.on{outline:3px solid var(--sky);outline-offset:2px}
.skwrap{border:2px solid var(--line);border-radius:12px;overflow:auto;max-height:50vh;background:#fff}
.skwrap canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.lock{position:absolute;inset:0;z-index:30;display:grid;place-items:start center;padding:90px 16px 16px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(5px)}
.lock .card{width:min(520px,100%);background:var(--surface);border-color:var(--bad);box-shadow:6px 6px 0 var(--bad)}
.pulse{animation:pulse 1.2s infinite}
.proctorRow{gap:10px 20px;padding:10px 12px;border:2px dashed var(--hair);border-radius:12px;background:var(--sunk)}

/* ---------- Trang sinh viên: gọn cho nhiều môn ---------- */
.svsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.sumbox{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--b,var(--surface))}
.sumbox b{font-size:24px;font-weight:900;line-height:1.1}
.sumbox span{font-size:12.5px;color:var(--ink2);font-weight:600}
.sumbox.on{background:var(--lemon-s);box-shadow:var(--block-sm)}
.cfilter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.cfilter button{all:unset;cursor:pointer;flex:none;display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:2px solid var(--hair);border-radius:99px;font-weight:700;font-size:13px;color:var(--ink2)}
.cfilter button i{width:10px;height:10px;border-radius:50%;background:var(--tone,var(--ink3));border:1.5px solid var(--line)}
.cfilter button.on{border-color:var(--line);color:var(--ink);background:var(--surface);box-shadow:var(--block-sm)}
.cfilter .count{background:var(--berry);color:#fff;border-radius:99px;padding:0 7px;font-size:11px}
.svlist{display:flex;flex-direction:column;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.svrow{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 14px;border-bottom:1.5px solid var(--hair);position:relative;min-height:52px}
.svrow:last-child{border-bottom:0}
.svrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tone,var(--ink3))}
.svrow:hover{background:var(--sunk)}
.svrow .ctag{flex:none;font-size:11px;font-weight:800;padding:2px 8px;border:1.5px solid var(--line);border-radius:6px;color:var(--ink);max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svmain{display:flex;flex-direction:column;min-width:0;flex:1}
.svmain b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svmain .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svrow .due{flex:none;font-size:12.5px;min-width:86px;text-align:right}
.svrow .svact{flex:none;min-width:92px;display:flex;justify-content:flex-end}
.svrow .score{font-weight:800}
.svrow.det{display:block;padding:0}
.svrow.det>summary{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 14px;cursor:pointer;list-style:none}
.svrow.det>summary::-webkit-details-marker{display:none}
.svrow.det[open]{padding-bottom:10px}.svrow.det .tw{margin:0 12px}
.cgroup{border:2px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:12px;overflow:hidden}
.cgroup>summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;cursor:pointer;background:color-mix(in srgb,var(--tone) 14%,var(--surface));list-style:none}
.cgroup>summary::-webkit-details-marker{display:none}
.cgroup>summary i{width:12px;height:12px;border-radius:4px;background:var(--tone);border:1.5px solid var(--line);flex:none}
.cgroup>.svlist{border:0;border-top:2px solid var(--line);border-radius:0}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;margin-bottom:16px;border:2px solid var(--line);border-radius:12px;background:var(--peach-s);font-size:13.5px}
.linkbox{display:flex;flex-direction:column;gap:8px;padding:10px;border:2px dashed var(--grape);border-radius:12px;background:color-mix(in srgb,var(--grape-s) 45%,transparent)}
.linkbox.big{padding:14px}
.links{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.links li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.links a{font-weight:800;color:var(--sky)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;gap:3px;padding:10px 14px;border:2px solid var(--hair);border-radius:12px;cursor:pointer}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode.on{border-color:var(--line);background:var(--lemon-s);box-shadow:var(--block-sm)}
.archrow{gap:10px;padding:8px 12px;border:2px solid var(--hair);border-radius:10px}
@media (max-width:700px){.svsum{grid-template-columns:1fr 1fr}.svrow{flex-wrap:wrap}.svrow .due{min-width:0;text-align:left}.svrow .svmain{flex-basis:calc(100% - 90px)}.modes{grid-template-columns:1fr}}

/* ---------- Chấm bài: bài làm là chính ---------- */
.gradewide{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.glist{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
.gitem{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1.5px solid var(--hair);cursor:pointer;position:relative}
.gitem:hover{background:var(--sunk)}.gitem[disabled]{opacity:.5;cursor:default}
.gitem.on{background:var(--berry-s);box-shadow:inset 4px 0 0 var(--berry)}
.gname{display:flex;flex-direction:column;min-width:0;flex:1}.gname b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gname .hint{font-size:11px}
.gflag{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.gpane{font-size:15px}.gpane .qbody{font-size:15px}
.gpane .attach{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.gpane .gq[open]{background:var(--sunk);border-radius:10px;padding:4px 10px}
table.compact td,table.compact th{padding:6px 9px}
/* ---------- Soạn đề: loại, khung giờ ---------- */
.catrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:10px 12px;border:2px solid var(--hair);border-radius:12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{padding:6px 14px;font-weight:700;font-size:13.5px;cursor:pointer;border-right:2px solid var(--line);background:var(--surface)}
.seg label:last-child{border-right:0}.seg label.on{background:var(--lemon)!important;color:#1E1B3A}
.seg input{position:absolute;opacity:0;pointer-events:none}
.sched{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px 16px;align-items:end;padding:12px;border:2px dashed var(--hair);border-radius:12px;background:var(--sunk)}
.sched .f>span{font-weight:600;font-size:13px}
/* ---------- Giám sát gọn ---------- */
.monsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.monsum>div{display:flex;flex-direction:column;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--b)}
.monsum b{font-size:24px;font-weight:900;line-height:1.1}.monsum span{font-size:12.5px;color:var(--ink2);font-weight:600}
.monrow{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 14px;border-bottom:1.5px solid var(--hair);position:relative;cursor:pointer;min-height:52px}
.monrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tone)}
.monrow:hover{background:var(--sunk)}
.stackbar{display:flex;width:160px;height:12px;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
/* ---------- Bảng vẽ kèm đề ---------- */
.modal .card.wide.xwide{width:min(1240px,100%);max-height:96vh}
.skgrid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.skgrid.noq{grid-template-columns:minmax(0,1fr)}.skgrid.noq .skq{display:none}
.skq{position:sticky;top:0;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--lemon-s);font-size:14px}
/* ---------- Nhập Excel ---------- */
.impdrop{display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center;padding:22px;border:2px dashed var(--sky);border-radius:14px;background:color-mix(in srgb,var(--sky-s) 50%,transparent);cursor:pointer}
.impdrop.over{background:var(--sky-s);border-style:solid}
.implist{max-height:180px;overflow:auto;font-size:12.5px;margin-top:6px;color:var(--ink)}
@media (max-width:900px){.gradewide{grid-template-columns:minmax(0,1fr)}.glist{position:static;max-height:220px}.skgrid{grid-template-columns:minmax(0,1fr)}.skq{position:static;max-height:200px}.sched{grid-template-columns:minmax(0,1fr)}.monsum{grid-template-columns:1fr 1fr}.stackbar{width:90px}}

/* ---------- Danh sách lớp, báo cáo, giám sát gọn ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
table.roster td{white-space:nowrap}table.roster td:nth-child(3){white-space:normal}
.repbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:10px}
.repbar .seg label{cursor:pointer}
.howto{flex-basis:100%}.howto summary{cursor:pointer;font-weight:700}
.clostrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:16px}
.clotile{display:flex;flex-direction:column;gap:5px;padding:8px 10px;border:2px solid var(--hair);border-radius:10px;background:var(--surface)}
.clotile b{font-size:18px;font-weight:900}.clotile.met{border-color:var(--mint)}.clotile.miss{border-color:var(--bad)}
.lvbar.thin{height:10px;min-width:0;border-width:1.5px;border-radius:6px}
.lvlegend{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2)}
.lvlegend i{display:inline-block;width:10px;height:10px;border:1.5px solid var(--line);border-radius:3px;margin-right:5px;vertical-align:-1px}
.mh{display:flex;align-items:center;gap:8px;margin:18px 0 10px}.mh i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.mh2>summary{list-style:none;cursor:pointer}.mh2>summary::-webkit-details-marker{display:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.slot{display:flex;flex-direction:column;gap:4px;padding:8px 10px;border:2px solid var(--hair);border-radius:10px}
.slot.hid{opacity:.75;border-style:dashed}

/* ---------- Danh sách CLO: chữ nhỏ, 2 dòng, rê/bấm để đọc đủ ---------- */
.clolist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 10px}
.cloitem{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border:1.5px solid var(--hair);border-radius:10px;background:var(--surface);font-size:12.5px;line-height:1.45;cursor:default;outline:none}
.cloitem .chip{flex:none;font-size:11px;padding:1px 8px}
.cloitem .clotext{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink2);min-width:0}
.cloitem:hover,.cloitem:focus{border-color:var(--line);box-shadow:var(--block-sm)}
.cloitem:hover .clotext,.cloitem:focus .clotext{-webkit-line-clamp:unset;display:block;color:var(--ink)}

.clodesc{font-size:11.5px;line-height:1.4;color:var(--ink)}
.clotile .hint{font-size:11.5px}
#tip{position:fixed;z-index:80;max-width:340px;padding:7px 10px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:12.5px;line-height:1.45;box-shadow:var(--block-sm);pointer-events:none}

/* ---------- Báo cáo ---------- */
.rep td.ok{background:color-mix(in srgb,var(--mint-s) 60%,transparent)}
.rep td.no{background:var(--bad-s);font-weight:700}
.lv{display:grid;grid-template-columns:repeat(4,1fr);height:22px;border:2px solid var(--line);border-radius:8px;overflow:hidden}
.lvbar{display:flex;height:24px;border:2px solid var(--line);border-radius:8px;overflow:hidden;min-width:160px}
.lvbar i{display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:#1E1B3A;min-width:0;overflow:hidden}
.paper{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--block)}
.paper .hdr{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center;font-size:13px;margin-bottom:16px}
.paper .hdr b{display:block}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px;font-size:13.5px;margin-bottom:14px}

/* ---------- Đăng nhập ---------- */
.login{min-height:100%;display:grid;place-items:center;padding:28px 16px}
.lbox{width:min(960px,100%);display:grid;grid-template-columns:1.1fr 1fr;border:2px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:8px 8px 0 var(--line);background:var(--surface)}
.lart{padding:34px;background:var(--berry);color:#fff;display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.lart h1{font-size:38px;font-weight:900;letter-spacing:-.02em}
.lart p{color:#FFE9F1;max-width:36ch}
.blobs{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
.blobs span{padding:8px 14px;border-radius:99px;border:2px solid #1E1B3A;font-weight:800;font-size:13px;color:#1E1B3A;box-shadow:2px 2px 0 #1E1B3A}
.lform{padding:34px;display:flex;flex-direction:column;gap:16px}
.role{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role button{padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;font-weight:800;display:flex;flex-direction:column;gap:2px}
.role button small{font-weight:500;color:var(--ink2)}
.role button.on{background:var(--lemon-s);box-shadow:var(--block-sm)}

/* ---------- Modal + toast ---------- */
.modal{position:fixed;inset:0;background:rgba(30,27,58,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal .card{width:min(560px,100%);max-height:90vh;overflow:auto}
.modal .card.wide{width:min(880px,100%)}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;padding:11px 16px;border:2px solid var(--line);border-radius:12px;background:var(--lemon);color:#1E1B3A;font-weight:700;box-shadow:var(--block);max-width:calc(100% - 36px)}

@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobilebar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--surface);border-bottom:2px solid var(--line)}
  .mobilebar button{flex:none}
  .exam{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;order:-1}
  .lbox{grid-template-columns:minmax(0,1fr)}
  .g3,.g2{grid-template-columns:minmax(0,1fr)}
  .meta{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.stat .v{font-size:26px}h1{font-size:23px}.lart h1{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#netBadge{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));opacity:.92;z-index:55;display:flex;align-items:center;gap:6px;padding:5px 10px;border:2px solid var(--line);border-radius:99px;background:var(--surface);font-size:12px;font-weight:700;box-shadow:var(--block)}
#netBadge i{width:9px;height:9px;border-radius:50%;background:var(--mint)}
#netBadge.busy i{background:var(--lemon)} #netBadge.off i{background:var(--bad);animation:pulse 1s infinite} #netBadge.off{background:var(--bad-s)}
.boot{min-height:100vh;display:grid;place-items:center;font-weight:700}
.pwbox{display:flex;flex-direction:column;gap:10px;max-width:420px}

/* ===== HỆ MÀU “TRỜI XANH PASTEL” =====
   Một màu chủ đạo (xanh trời) cho mọi thao tác chính; các màu phụ cùng độ sáng, độ bão hòa thấp để hài hòa.
   Mỗi màu có 3 cấp: nền nhạt (-s), viền (-b), chữ đậm cùng sắc (-t) → chữ luôn đủ tương phản trên nền pastel. */
:root{
  --sky-b:#A9CBF2; --sky-t:#1D5FAA; --sky-tint:#EEF5FE;
  --mint-b:#9ED8C2; --mint-t:#11684F;
  --lemon-b:#F0D27E; --lemon-t:#7A5600;
  --berry-b:#F2B3CB; --berry-t:#A3335F;
  --grape-b:#C9C0F2; --grape-t:#4E3FA8;
  --peach-b:#F5C3A2; --peach-t:#9A4A16;
  --bad-b:#F1A9AF; --bad-t:#A82633;
}
/* Nút: 1 nút chính (xanh đặc) cho việc quan trọng nhất; các nút màu là pastel nhạt + chữ đậm cùng sắc */
.btn{border-width:1.5px;border-color:var(--line);transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--block);border-color:var(--sky-b)}
.btn:active{transform:none;box-shadow:none}
.btn:focus-visible{outline:3px solid rgba(42,116,201,.35);outline-offset:2px}
.btn.pri,.qnav button.cur{background:var(--sky);border-color:var(--sky);color:#fff}
.btn.pri:hover{background:#2367B5;border-color:#2367B5}
.btn.sky{background:var(--sky-s);border-color:var(--sky-b);color:var(--sky-t)}
.btn.mint{background:var(--mint-s);border-color:var(--mint-b);color:var(--mint-t)}
.btn.lemon{background:var(--lemon-s);border-color:var(--lemon-b);color:var(--lemon-t)}
.btn.ghost{background:transparent;border-color:var(--hair);box-shadow:none}
.btn.bad{background:var(--bad-s);border-color:var(--bad-b);color:var(--bad-t)}
.btn.ghost:hover{background:var(--sky-tint)}
/* Thẻ, ô nhập, bảng */
.card,.paper{border-width:1.5px;border-color:var(--line)}
.in{border-width:1.5px}
.in:focus{border-color:var(--sky);box-shadow:0 0 0 3px rgba(42,116,201,.16)}
th{color:var(--ink2);background:var(--sky-tint)}
a{color:var(--sky-t)}
.side,.mobilebar{border-color:var(--line)}
/* Nhãn (chip): nền pastel + viền + chữ cùng sắc */
.chip{border-width:1px}
.c-berry{background:var(--berry-s);border-color:var(--berry-b);color:var(--berry-t)}
.c-sky{background:var(--sky-s);border-color:var(--sky-b);color:var(--sky-t)}
.c-mint{background:var(--mint-s);border-color:var(--mint-b);color:var(--mint-t)}
.c-lemon{background:var(--lemon-s);border-color:var(--lemon-b);color:var(--lemon-t)}
.c-grape{background:var(--grape-s);border-color:var(--grape-b);color:var(--grape-t)}
.c-peach{background:var(--peach-s);border-color:var(--peach-b);color:var(--peach-t)}
.c-bad{background:var(--bad-s);border-color:var(--bad-b);color:var(--bad-t)}
.c-plain{background:var(--sunk);border-color:var(--hair);color:var(--ink2)}
/* Điều hướng, thẻ chọn */
.nav button.on,.gitem.on{background:var(--sky-s);border-color:var(--sky-b);color:var(--sky-t)}
.gitem.on{box-shadow:inset 4px 0 0 var(--sky)}
.nav .count,.cfilter .count{background:var(--sky)}
.ctx{background:var(--sky-tint);border-color:var(--sky-b);box-shadow:none}
.tabs button.on,.sumbox.on,.mode.on,.role button.on{background:var(--sky-s);border-color:var(--sky-b);color:var(--sky-t)}
.seg label.on{background:var(--sky)!important;color:#fff}
.seg label{border-color:var(--line)}
.sumbox,.monsum>div{border-width:1.5px;border-color:var(--line)}
.opt{border-width:1.5px}
.opt.sel{border-color:var(--sky);background:var(--sky-s);box-shadow:0 0 0 3px rgba(42,116,201,.12)}
.opt.right{border-color:var(--mint-b);background:var(--mint-s)}
.qnav button{border-width:1.5px}
.qnav button.done{background:var(--mint-s);border-color:var(--mint-b);color:var(--mint-t)}
.logo{background:var(--sky);color:#fff;border-color:var(--sky)}
.timer{border-width:1.5px;background:var(--sky-tint);border-color:var(--sky-b);color:var(--sky-t);box-shadow:none}
.timer.warn{background:var(--lemon-s);border-color:var(--lemon-b);color:var(--lemon-t)}
.timer.crit{background:var(--bad-s);border-color:var(--bad);color:var(--bad-t);animation:glowBad 1s ease-in-out infinite}
.toast{background:#15304F;color:#fff;border-color:#15304F}
.code,.in.code,textarea.in.code,pre.in.code{background:#14263D;color:#EEF5FF;caret-color:#FFD565}
/* Đăng nhập */
.lbox{box-shadow:0 20px 50px -24px rgba(21,48,79,.35);border-width:1.5px}
.lart{background:linear-gradient(155deg,#3C86D8 0%,#5FA4EC 60%,#8CC4F5 100%)}
.lart p{color:#F0F7FF}
.lart .eyebrow{color:#E3F0FF!important}
.blobs span{border:0;box-shadow:none;color:#15304F;background:rgba(255,255,255,.92)!important}
.lock .card{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-s),0 16px 40px -16px rgba(210,64,76,.5)}

/* ===== CƠ CHẾ NHẤN MẠNH: dẫn ánh mắt theo mức độ =====
   1) Thông tin  – vạch màu bên trái + nền nhạt (không chuyển động)
   2) Cần chú ý  – vầng sáng vàng thở chậm (.attn-warn)
   3) Khẩn cấp   – vầng sáng đỏ nhấp nháy (.attn-bad, .pulse), chấm đỏ nhấp nháy (.live)
   4) Việc nên làm tiếp – vầng sáng xanh mời bấm (.attn) */
@keyframes glowSky{0%,100%{box-shadow:0 0 0 0 rgba(42,116,201,.0)}50%{box-shadow:0 0 0 6px rgba(42,116,201,.22)}}
@keyframes glowWarn{0%,100%{box-shadow:0 0 0 0 rgba(232,170,40,.0)}50%{box-shadow:0 0 0 6px rgba(232,170,40,.30)}}
@keyframes glowBad{0%,100%{box-shadow:0 0 0 0 rgba(210,64,76,.0)}50%{box-shadow:0 0 0 7px rgba(210,64,76,.28)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.attn{animation:glowSky 2.2s ease-in-out infinite}
.attn-warn{animation:glowWarn 2.4s ease-in-out infinite}
.attn-bad,.pulse{animation:glowBad 1.1s ease-in-out infinite}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:1px;animation:blink 1s infinite}
.live.sky{background:var(--sky)} .live.mint{background:var(--mint)} .live.warn{background:#E8AA28}
.nav .count.hot{background:var(--bad);animation:glowBad 1.1s ease-in-out infinite}
.nav .count.warm{background:#E8AA28;color:#3D2B00}
.banner{border-width:1.5px;border-color:var(--peach-b);background:var(--peach-s);border-left:6px solid var(--peach);color:var(--ink)}
.banner.info{border-color:var(--sky-b);background:var(--sky-tint);border-left-color:var(--sky)}
.banner.warn{border-color:var(--lemon-b);background:var(--lemon-s);border-left-color:#E8AA28}
.banner.bad{border-color:var(--bad-b);background:var(--bad-s);border-left-color:var(--bad)}
.due.urgent{color:var(--bad-t)!important;font-weight:800}
.due.urgent::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:1px;animation:blink 1s infinite}
.svrow.hot{background:linear-gradient(90deg,var(--bad-s),transparent 60%)}
.svrow.doing{background:linear-gradient(90deg,var(--sky-tint),transparent 70%)}
tr.locked td{background:var(--bad-s)!important}
tr.locked td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.monsum .hot{border-color:var(--bad)!important;animation:glowBad 1.1s ease-in-out infinite}
.mh i{animation:none}
.mh.live-h i{animation:blink 1.4s infinite}
@media (prefers-reduced-motion:reduce){.attn,.attn-warn,.attn-bad,.pulse,.live,.due.urgent::before,.nav .count.hot,.monsum .hot{animation:none!important}}

<body>
<div id="root"></div>
<div id="layer"></div>
<script>
/* ================== TIỆN ÍCH ================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 9);
const fmt = (n, d = 2) => (n == null || isNaN(n)) ? '–' : (+n).toFixed(d).replace(/\.?0+$/, '') || '0';
const fmt1 = n => (n == null || isNaN(n)) ? '–' : (+n).toFixed(1);
const pct = n => (n == null || isNaN(n)) ? '–' : Math.round(n * 100) + '%';
const sum = a => a.reduce((s, x) => s + (+x || 0), 0);
const round25 = x => Math.round(x * 4) / 4;
const dt = ts => ts ? new Date(ts).toLocaleString('vi-VN', {hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'}) : '–';

function toast(msg) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.setAttribute('role', 'status');
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

const QTYPES = {
  TL:  {name:'Tự luận',   chip:'c-sky',   auto:false},
  TN:  {name:'Trắc nghiệm', chip:'c-lemon', auto:true},
  VD:  {name:'Vấn đáp',   chip:'c-peach', auto:false},
  PY:  {name:'Python',    chip:'c-mint',  auto:true, lang:'python', ver:'3.10.0'},
  C:   {name:'C',         chip:'c-mint',  auto:true, lang:'c',      ver:'10.2.0'},
  CPP: {name:'C++',       chip:'c-mint',  auto:true, lang:'c++',    ver:'10.2.0'},
  LINK:{name:'Nộp link',  chip:'c-grape', auto:false},
};
const EXAM_KIND = {TL:'Thi viết', TN:'Trắc nghiệm', VD:'Vấn đáp', TH:'Thực hành', BT:'Bài tập'};
/* Phân loại: Thi (một hình thức: viết / trắc nghiệm / vấn đáp / thực hành) hoặc Bài tập (trộn mọi loại câu).
   Bài tập có thể được hoặc không được tính vào CLO (GV tick chọn). */
const THI_KIND = {TL:'viết', TN:'trắc nghiệm', VD:'vấn đáp', TH:'thực hành'};
const examCat = e => e.cat || (e.kind === 'BT' ? 'bt' : 'thi');
const examLabel = e => examCat(e) === 'bt' ? 'Bài tập' : 'Thi ' + (THI_KIND[e.kind] || 'viết');
const countsClo = e => examCat(e) === 'thi' || e.countClo !== false;
/* Khung giờ: đề tạo trước, đến giờ mở thì tự mở, đến giờ đóng thì tự kết thúc (không cần GV bấm). */
function phase(e) {
  if (e.status === 'draft') return 'draft';
  if (e.status === 'closed') return 'closed';
  const n = Date.now();
  if (e.opensAt && e.opensAt > n) return 'scheduled';
  if (e.closesAt && e.closesAt <= n) return 'ended';
  return 'open';
}

/* ================== PHÂN RÃ ĐỀ ==================
   Quy ước:
   – Mỗi câu bắt đầu bằng dòng "## <nhãn>" hoặc dòng "Câu <số> ..." (như đề Word).
   – Trên dòng tiêu đề: [CLOn] gán chuẩn đầu ra; (x điểm) hoặc (xđ) là điểm tối đa;
     {TL} tự luận (mặc định), {TN} trắc nghiệm, {VD} vấn đáp, {PY} Python, {C} C, {CPP} C++.
   – Trắc nghiệm: phương án "A. …" ; đánh dấu đáp án đúng bằng "*" đầu dòng hoặc dòng "Đáp án: B".
   – Thực hành: mỗi test một dòng ">>> đầu vào => kết quả mong đợi" (xuống dòng trong đầu vào viết \n).
   – Phần văn bản trước câu đầu tiên được coi là lời dẫn của đề. */
function parseExam(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  // Có dòng "##" thì chỉ tách theo "##"; nếu không, tách theo dòng "Câu <số>" như đề Word.
  const hashMode = lines.some(l => /^\s*#{2,}/.test(l));
  const head = hashMode ? /^\s*#{2,}\s*(.*)$/ : /^\s*((?:Câu|Cau|Question)\s+\d+[a-zđ]?\b.{0,80})$/i;
  const qs = []; let pre = []; let cur = null;
  for (const ln of lines) {
    const m = ln.match(head);
    if (m) { cur = {header: m[1].trim(), body: []}; qs.push(cur); }
    else if (cur) cur.body.push(ln); else pre.push(ln);
  }
  const questions = qs.map((b, i) => {
    let h = b.header;
    const clo = (h.match(/\[?\b(CLO\s*\d+)\]?/i) || [])[1]?.replace(/\s/g, '').toUpperCase() || '';
    const mp = h.match(/\(\s*(\d+(?:[.,]\d+)?)\s*(?:điểm|đ|d|diem)?\s*\)/i) || h.match(/\|\s*(\d+(?:[.,]\d+)?)\s*(?:điểm|đ)?/i);
    const max = mp ? parseFloat(mp[1].replace(',', '.')) : 1;
    const tm = h.match(/\{\s*(TL|TN|VD|LINK|PY|PYTHON|C\+\+|CPP|C)\s*\}/i);
    let type = tm ? tm[1].toUpperCase() : 'TL';
    if (type === 'PYTHON') type = 'PY'; if (type === 'C++') type = 'CPP';
    let label = h.replace(/\[?\bCLO\s*\d+\]?/ig, '').replace(/\(.*?\)/g, '').replace(/\{.*?\}/g, '').replace(/\|.*$/, '').replace(/[:.\-–\s]+$/, '').trim();
    if (!label) label = 'Câu ' + (i + 1);
    const options = [], tests = []; let answer = ''; const textLines = [];
    for (const ln of b.body) {
      const om = ln.match(/^\s*(\*)?\s*([A-H])[.)]\s+(.*)$/);
      const am = ln.match(/^\s*(?:Đáp án|Dap an|ĐA)\s*[:：]\s*([A-H])/i);
      const ts = ln.match(/^\s*>>>\s?(.*?)\s*=>\s*(.*)$/);
      if (am) { answer = am[1].toUpperCase(); if (type === 'TL') type = 'TN'; }
      else if (ts) tests.push({input: ts[1].replace(/\\n/g, '\n'), expect: ts[2].replace(/\\n/g, '\n')});
      else if (om && !(tm && type !== 'TN') && (type === 'TN' || options.length || /^\s*\*?\s*A[.)]/.test(ln))) {
        options.push({key: om[2], text: om[3]}); if (om[1]) answer = om[2];
        if (type === 'TL') type = 'TN';
      } else textLines.push(ln);
    }
    if (tests.length && type === 'TL') type = 'PY';
    return {id: 'q' + (i + 1) + '_' + Math.random().toString(36).slice(2, 6), label, clo, max, type,
            text: textLines.join('\n').trim(), options, answer, tests};
  });
  return {preamble: pre.join('\n').trim(), questions};
}

function examIssues(qs, course) {
  const out = [];
  if (!qs.length) out.push('Chưa nhận diện được câu hỏi nào. Mỗi câu cần bắt đầu bằng "## Câu …" hoặc "Câu 1 (2 điểm)".');
  qs.forEach(q => {
    if (!q.clo) out.push(`${q.label}: chưa gán CLO.`);
    else if (!course.clos.some(c => c.id === q.clo)) out.push(`${q.label}: ${q.clo} chưa có trong danh mục CLO của học phần.`);
    if (q.type === 'TN' && !q.answer) out.push(`${q.label}: chưa có đáp án đúng.`);
    if (q.type === 'TN' && q.options.length < 2) out.push(`${q.label}: cần ít nhất 2 phương án.`);
    if (q.type === 'LINK' && q.options.length) out.push(`${q.label}: câu nộp link không cần phương án.`);
    if (isCode(q.type) && !q.tests.length) out.push(`${q.label}: chưa có test (dòng ">>> vào => ra"), hệ thống không tự chấm được.`);
    if (!(q.max > 0)) out.push(`${q.label}: điểm tối đa không hợp lệ.`);
  });
  return out;
}

/* ================== CHẤM ĐIỂM ================== */
function autoGrade(exam, sub, silent) {
  exam.questions.forEach(q => {
    if (q.type === 'TN') sub.scores[q.id] = (sub.answers[q.id] || '') === q.answer ? q.max : 0;
  });
  sub.graded = exam.questions.every(q => sub.scores[q.id] != null);
}
const subTotal = (exam, sub) => sum(exam.questions.map(q => sub.scores?.[q.id] ?? 0));
const examMax = exam => sum(exam.questions.map(q => q.max));
const pendingQs = (exam, sub) => exam.questions.filter(q => sub.scores?.[q.id] == null);

// Chạy mã qua bộ chấm (Piston API). Không gọi được → trả null để GV chấm tay.
async function runCode(type, code, input) {
  const T = QTYPES[type];
  const files = [{name: type === 'PY' ? 'main.py' : type === 'C' ? 'main.c' : 'main.cpp', content: code}];
  const ctl = new AbortController(); setTimeout(() => ctl.abort(), 12000);
  const r = await fetch(DB.settings.judgeUrl, {method:'POST', headers:{'Content-Type':'application/json'}, signal: ctl.signal,
    body: JSON.stringify({language: T.lang, version: T.ver, files, stdin: input})});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.compile && j.compile.code) return {out: j.compile.stderr || j.compile.output, ok:false};
  return {out: (j.run?.stdout || '') + (j.run?.stderr ? '\n' + j.run.stderr : ''), ok: true};
}
const sameOut = (a, b) => String(a).trim().replace(/\s+\n/g, '\n').replace(/\r/g, '') === String(b).trim().replace(/\r/g, '');
async function gradeCode(q, code) {
  if (!code || !code.trim()) return q.tests.map(() => 0);
  const res = [];
  for (const t of q.tests) { const r = await runCode(q.type, code, t.input); res.push(r.ok && sameOut(r.out, t.expect) ? 1 : 0); }
  return res;
}

/* ================== THỐNG KÊ CLO ================== */
/* Báo cáo CLO cho một tập sinh viên (một lớp HP hoặc gộp nhiều lớp) trên các đề được chọn của một học phần. */
function cloReport(course, examIds, studentIds) {
  const C = course, exams = DB.exams.filter(e => examIds.includes(e.id) && e.courseId === C.id && countsClo(e));
  const max = {}; C.clos.forEach(c => max[c.id] = 0);
  exams.forEach(e => e.questions.forEach(q => { if (max[q.clo] != null) max[q.clo] += q.max; }));
  // Mỗi SV chỉ được đo trên các đề đã giao cho chính SV đó (mx = điểm tối đa CLO của riêng SV).
  const rows = studentIds.map(id => DB.students.find(s => s.id === id)).filter(Boolean).map(s => {
    const sc = {}, mx = {}; C.clos.forEach(c => { sc[c.id] = 0; mx[c.id] = 0; }); let missing = 0, pending = 0;
    exams.forEach(e => {
      if (!e.assigned.includes(s.id)) return;
      e.questions.forEach(q => { if (mx[q.clo] != null) mx[q.clo] += q.max; });
      const sub = DB.subs.find(x => x.examId === e.id && x.svId === s.id);
      if (!sub || !sub.submittedAt) { missing++; return; }
      e.questions.forEach(q => { const v = sub.scores?.[q.id]; if (v == null) pending++; else if (sc[q.clo] != null) sc[q.clo] += v; });
    });
    const fail = C.clos.filter(c => mx[c.id] > 0 && sc[c.id] < mx[c.id] * C.threshold / 100).length;
    return {s, sc, mx, fail, missing, pending};
  }).filter(r => Object.values(r.mx).some(v => v > 0) || !exams.length);
  const clos = C.clos.map(c => {
    const m = max[c.id], need = m * C.threshold / 100;
    const measured = rows.filter(r => r.mx[c.id] > 0);
    const ratios = measured.map(r => r.sc[c.id] / r.mx[c.id]);
    const L = {exceed:0, expect:0, min:0, fail:0};
    ratios.forEach(x => { if (x * 100 >= C.levels.exceed) L.exceed++; else if (x * 100 >= C.levels.expect) L.expect++; else if (x * 100 >= C.threshold) L.min++; else L.fail++; });
    const pass = ratios.filter(x => x * 100 >= C.threshold).length, n = measured.length;
    return {...c, max: m, need, n, pass, rate: n ? pass / n : 0, avg: n ? sum(ratios) / n : 0, L, met: n > 0 && pass / n * 100 >= c.target};
  });
  return {rows, clos, exams};
}

function serialize(d) {
  const qs = d.questions.map(q => {
    let s = `## ${q.label} [${q.clo || 'CLO?'}] (${q.max} điểm)${q.type !== 'TL' ? ` {${q.type}}` : ''}\n${q.text}`;
    if (q.type === 'TN') s += '\n' + q.options.map(o => `${o.key === q.answer ? '*' : ''}${o.key}. ${o.text}`).join('\n');
    if (q.tests.length) s += '\n' + q.tests.map(t => `>>> ${t.input.replace(/\n/g, '\\n')} => ${t.expect.replace(/\n/g, '\\n')}`).join('\n');
    return s;
  });
  return (d.preamble ? d.preamble + '\n\n' : '') + qs.join('\n\n');
}
const sdt = ts => { const d = new Date(ts); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')} ${d.getDate()}/${d.getMonth() + 1}`; };

const fromLocalInput = v => v ? new Date(v).getTime() : null;

}

function editorSummary(d, issues) {
  const C = COURSE(d.courseId), tot = sum(d.questions.map(q => +q.max || 0)), n = d.questions.length;
  const byClo = C.clos.map(c => ({c, v: sum(d.questions.filter(q => q.clo === c.id).map(q => +q.max || 0))}));
  const noClo = sum(d.questions.filter(q => !q.clo).map(q => +q.max || 0));
  // gộp câu nhiều phần: "Câu 2a", "Câu 2b" → Câu 2
  const groups = {}; d.questions.forEach(q => { const m = q.label.match(/^(.*?\d+)([a-zđ])$/i); if (m) (groups[m[1]] ||= []).push(q); });
  const target = +d.target || 0, diff = target ? Math.round((tot - target) * 100) / 100 : 0;
  return `
      <div class="row" style="gap:6px"><span class="chip c-plain num">${n} câu</span><span class="chip ${diff ? 'c-bad' : 'c-mint'} num" style="font-size:13px">Tổng ${fmt(tot)} điểm</span>
        ${target ? (diff ? `<span class="chip c-lemon num">${diff > 0 ? 'thừa' : 'thiếu'} ${fmt(Math.abs(diff))} so với ${fmt(target)}</span>` : `<span class="chip c-mint">khớp tổng điểm đề</span>`) : ''}
        ${n ? `<span class="hint num">bình quân ${fmt(tot / n)} điểm/câu</span>` : ''}</div>
      ${Object.keys(groups).length ? `<div class="hint num">${Object.entries(groups).map(([g, qs]) => `${esc(g)} = ${qs.map(q => esc(q.label.replace(/^Câu\s*/i, '')) + ' ' + fmt(+q.max || 0)).join(' + ')} = <b>${fmt(sum(qs.map(q => +q.max || 0)))}</b>`).join(' · ')}</div>` : ''}
      <div class="tw"><table><thead><tr><th>CLO</th><th class="r">Điểm</th><th class="r">Trọng số</th><th>Câu</th></tr></thead><tbody>
        ${byClo.map(({c, v}) => `<tr><td>${cloChip(c.id, C)}</td><td class="r num">${fmt(v)}</td><td class="r num">${tot ? pct(v / tot) : '–'}</td><td class="hint">${d.questions.filter(q => q.clo === c.id).map(q => esc(q.label.replace(/^Câu\s*/i, ''))).join(', ')}</td></tr>`).join('')}
        ${noClo ? `<tr><td><span class="chip c-bad">Chưa gán</span></td><td class="r num">${fmt(noClo)}</td><td class="r num">${pct(noClo / tot)}</td><td></td></tr>` : ''}
      </tbody><tfoot><tr><td>Tổng</td><td class="r num">${fmt(tot)}</td><td class="r num">${tot ? '100%' : '–'}</td><td></td></tr></tfoot></table></div>
      ${kindWarn(d).map(w => `<span class="chip c-lemon" style="white-space:normal">${esc(w)}</span>`).join('')}
      ${issues.length ? `<div class="stack" style="gap:4px">${issues.map(x => `<span class="chip c-bad" style="white-space:normal">${esc(x)}</span>`).join('')}</div>` : '<span class="chip c-mint">Đề hợp lệ, sẵn sàng giao bài</span>'}`;
}

        ${isCode(q.type) ? `<div class="tests">${q.tests.map((t, k) => `<span>Test ${k + 1}</span><code>${esc(t.input.replace(/\n/g, '↵'))} → ${esc(t.expect)}</code>`).join('') || '<span>Chưa có test</span><span></span>'}</div>` : ''}

function kindWarn(d) {
  if (examCat(d) === 'bt' || !d.questions.length) return [];
  const ok = {TN: t => t === 'TN', VD: t => t === 'VD', TH: t => isCode(t), TL: t => ['TL','LINK'].includes(t)}[d.kind in THI_KIND ? d.kind : 'TL'];
  const bad = d.questions.filter(q => !ok(q.type));
  return bad.length ? [`Đề thi ${THI_KIND[d.kind] || 'viết'} có ${bad.length} câu khác hình thức (${bad.map(q => q.label).join(', ')}). Nếu cần trộn nhiều loại câu, chọn “Bài tập”.`] : [];
}

/* Chia điểm: đủ tổng mục tiêu, bước 0,25; phần dư dồn vào các câu đầu (chia đều) hoặc câu lớn nhất (tỷ lệ) */
function distribute(d, mode) {
  const qs = d.questions, n = qs.length, T = +d.target || 10, Q = 4; if (!n) return;
  const units = Math.round(T * Q); let alloc;
  if (mode === 'equal') { const b = Math.floor(units / n); alloc = qs.map((_, i) => b + (i < units - b * n ? 1 : 0)); }
  else { const cur = sum(qs.map(q => +q.max || 0)) || n; alloc = qs.map(q => Math.floor((+q.max || (cur / n)) / cur * units));
    let rest = units - sum(alloc); const order = qs.map((q, i) => i).sort((a, b) => (+qs[b].max || 0) - (+qs[a].max || 0)); for (let k = 0; rest > 0; k++, rest--) alloc[order[k % n]]++; }
  qs.forEach((q, i) => q.max = alloc[i] / Q); d.target = T;
}

function readDraftMeta() {

  d.proctor = {mode, maxLeaves: Math.max(0, +$('#p_max').value || 0), lockOnReturn: $('#p_lock').checked, allowImage: mode === 'free' ? true : $('#p_img').checked};
  d.closesAt = fromLocalInput($('#d_close').value);

      if (q.type === 'TN') ans = `<div class="opts" style="padding:0">${q.options.map(o => `<div class="opt ${o.key === q.answer ? 'right' : ''} ${o.key === a ? 'sel' : ''}"><span class="L">${o.key}</span><span>${esc(o.text)}</span>${o.key === a ? '<span class="chip c-plain" style="margin-left:auto">SV chọn</span>' : ''}</div>`).join('')}</div>`;
      else if (isCode(q.type)) {
        const r = sub.runs?.[q.id];
        ans = `<pre class="in code" style="margin:0;white-space:pre;overflow-x:auto;min-height:0">${esc(a) || '(không có mã)'}</pre>
          <div class="row" style="gap:6px">${q.tests.map((t, k) => `<span class="chip ${r ? (r[k] ? 'c-mint' : 'c-bad') : 'c-plain'}">Test ${k + 1} ${r ? (r[k] ? 'đạt' : 'sai') : ''}</span>`).join('')}
          <button class="btn sm ghost" data-act="rerun" data-sub="${sub.id}" data-q="${q.id}">Chạy lại test</button></div>`;
      } else if (q.type === 'VD') ans = `<p class="hint">Câu vấn đáp: nhập điểm sau buổi hỏi.</p>`;
      else { const A = ansObj(a); ans = `<div class="qbody" style="padding:10px;border:2px dashed var(--hair);border-radius:10px">${esc(A.text) || '<span class="faint">(không có phần chữ)</span>'}</div>
        ${A.links.length ? `<ul class="links">${A.links.map(l => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(linkHost(l.url))}</a><span class="hint" style="overflow-wrap:anywhere">${esc(l.url)}</span><span class="hint num">${hm(l.at)}</span></li>`).join('')}</ul>` : ''}
        ${A.imgs.length ? `<div class="attach">${A.imgs.map((im, i) => `<figure><img src="${im.src}" alt="${im.kind === 'draw' ? 'Hình vẽ' : 'Ảnh'} ${i + 1}" data-act="gvImg" data-sub="${sub.id}" data-q="${q.id}" data-i="${i}"><figcaption><span class="chip ${im.kind === 'draw' ? 'c-lemon' : 'c-sky'}">${im.kind === 'draw' ? 'Hình vẽ' : 'Ảnh dán'} ${i + 1}</span></figcaption></figure>`).join('')}</div>` : ''}`; }
      return `<div class="stack" style="gap:8px;padding-top:10px;border-top:2px solid var(--hair)">
        <div class="row"><b>${esc(q.label)}</b>${cloChip(q.clo, C)}<span class="chip ${QTYPES[q.type].chip}">${QTYPES[q.type].name}</span>
          <label class="row" style="gap:4px;margin-left:auto"><input class="in num" style="width:78px;padding:4px 8px" type="number" step="0.25" min="0" max="${q.max}" value="${v ?? ''}" data-score="${q.id}"> / ${fmt(q.max)}</label></div>
        <details class="gq"><summary class="hint" style="cursor:pointer">Đề bài</summary><div class="qbody" style="padding:6px 0">${esc(q.text)}</div></details>
        ${ans}
        <input class="in" placeholder="Nhận xét cho sinh viên (tùy chọn)" value="${esc(sub.feedback?.[q.id] || '')}" data-fb="${q.id}">
      </div>`; }).join('')}
    <div class="row"><button class="btn mint" data-act="saveGrade" data-id="${sub.id}">Lưu điểm</button><button class="btn ghost" data-act="nextSub" data-id="${sub.id}">Bài tiếp theo</button></div>
  </div>`;
}
</script>
<script>
/* ================== GV · BÁO CÁO CLO (theo Mẫu 2 BC-KQĐLCĐR) ==================
   Phạm vi: một lớp học phần, hoặc gộp toàn bộ lớp của học phần (kèm bảng so sánh giữa các lớp). */
const LV = {exceed:'var(--mint)', expect:'var(--sky)', min:'var(--lemon)', fail:'var(--bad)'};
function repContext() {
  const sec = SEC(), C = CUR();
  const course = S.repScope === 'course';
  const secs = course ? DB.sections.filter(s => s.courseId === C.id).sort(termSort) : [sec];
  const avail = DB.exams.filter(e => e.courseId === C.id && !['draft','scheduled'].includes(phase(e)) && e.sectionIds.some(id => secs.some(s => s.id === id)));
  const key = `${sec.id}|${S.repScope}`;
  if (S.repKey !== key || !S.repExams) {
    const closed = avail.filter(e => isDone(e) && countsClo(e));
    S.repExams = (closed.length ? closed : avail).map(e => e.id); S.repKey = key;
  }
  const students = [...new Set(secs.flatMap(s => s.students))];
  return {sec, C, secs, avail, students, course};
}
function gvReport() {
  const {sec, C, secs, avail, students, course} = repContext();
  const R = cloReport(C, S.repExams, students);
  const weak = R.clos.filter(c => c.max && !c.met);
  const clsOf = id => secs.filter(s => s.students.includes(id)).map(s => s.cls).join(', ');
  const noteKey = course ? 'courseNote_' + C.id : 'note';
  const note = course ? (C.reportNote ?? null) : (sec.reportNote ?? null);
  return `
  ${pageHead('Đo lường mức độ đạt chuẩn đầu ra', 'Báo cáo CLO', course ? `${esc(C.name)} · ${secs.length} lớp học phần · ${students.length} SV` : secSub(),
    `<button class="btn ghost" data-act="exportRep">Xuất CSV</button><button class="btn sky" data-act="syncSheet">Gửi lên Google Sheet</button>`)}
  <div class="repbar">
    <div class="seg"><label class="${!course ? 'on' : ''}" data-act="repScope" data-v="sec">Lớp ${esc(sec.cls)}</label><label class="${course ? 'on' : ''}" data-act="repScope" data-v="course">Gộp học phần (${DB.sections.filter(s => s.courseId === C.id).length} lớp)</label></div>
    <span class="eyebrow">Thành phần</span>
    <div class="row" style="gap:6px;flex:1">${avail.map(e => countsClo(e) ? `<label class="chip ${S.repExams.includes(e.id) ? 'c-lemon' : 'c-plain'}" style="cursor:pointer"><input type="checkbox" data-rep="${e.id}" ${S.repExams.includes(e.id) ? 'checked' : ''}> ${e.component} · ${esc(e.title)}</label>`
      : `<span class="chip c-plain" style="opacity:.55" title="Bài tập được đặt không tính vào CLO">${esc(e.title)} · không tính</span>`).join('') || '<span class="hint">Chưa có đề nào được giao.</span>'}</div>
    <details class="howto"><summary class="hint">Cách tính</summary><p class="hint">Điểm CLO = tổng điểm các câu gắn CLO trong những đề được chọn; mỗi SV chỉ được đo trên đề đã giao cho mình (điểm dạng “x/y” khi điểm tối đa khác cột chung). Đạt CLO khi ≥ ${C.threshold}% điểm tối đa. Mức: vượt kỳ vọng ≥ ${C.levels.exceed}%, đạt kỳ vọng ≥ ${C.levels.expect}%, đạt tối thiểu ≥ ${C.threshold}%.</p></details>
  </div>
  <div class="clostrip">${R.clos.map(c => `
    <div class="clotile ${c.max ? (c.met ? 'met' : 'miss') : ''}">
      <div class="row" style="justify-content:space-between">${cloChip(c.id, C)}<b class="num">${c.max ? pct(c.rate) : '–'}</b></div>
      <div class="lvbar thin">${['exceed','expect','min','fail'].map(k => c.L[k] && c.max ? `<i style="flex:${c.L[k]};background:${LV[k]}" title="${c.L[k]} SV"></i>` : '').join('')}</div>
      <span class="clodesc">${esc(c.desc)}</span>
      <span class="hint num" style="margin-top:auto">${c.max ? `${c.pass}/${c.n} SV đạt · mục tiêu ${c.target}%` : 'chưa đo'}</span>
    </div>`).join('')}
    <div class="lvlegend">${[['exceed','Vượt kỳ vọng'],['expect','Đạt kỳ vọng'],['min','Đạt tối thiểu'],['fail','Không đạt']].map(([k, t]) => `<span><i style="background:${LV[k]}"></i>${t}</span>`).join('')}</div>
  </div>

  <div class="paper">
    <div class="hdr"><div><b>TRƯỜNG ĐH PHẠM VĂN ĐỒNG</b>KHOA CÔNG NGHỆ THÔNG TIN</div><div><b>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</b>Độc lập – Tự do – Hạnh phúc</div></div>
    <h2 style="text-align:center">BÁO CÁO</h2>
    <p style="text-align:center;font-weight:700;margin-bottom:16px">Kết quả đo lường, đánh giá mức độ người học đạt chuẩn đầu ra của học phần</p>
    <h3 style="margin-bottom:8px">I. Thông tin chung</h3>
    <div class="meta"><span>Tên CTĐT: <b>${esc(C.program)}</b></span><span>Bậc đào tạo: <b>${esc(C.level)}</b></span>
      <span>Khóa đào tạo: <b>${esc([...new Set(secs.map(s => s.cohort))].join(', '))}</b></span><span>Học phần: <b>${esc(C.name)}</b></span>
      <span>Mã học phần: <b>${esc(C.code)}</b> · Số tín chỉ: <b>${C.credits}</b></span><span>Giảng viên: <b>${esc([...new Set(secs.map(s => teacherName(s.teacherId)))].join(', '))}</b></span>
      <span>Học kỳ – Năm học: <b>${esc([...new Set(secs.map(termKey))].join('; '))}</b></span><span>Lớp HP/Tổng số SV: <b>${esc(secs.map(s => s.cls).join(', '))}/${R.rows.length}</b></span></div>

    <h3 style="margin:16px 0 8px">II. Cơ cấu đánh giá</h3>
    <div class="tw"><table><thead><tr><th>Thành phần</th><th>Công cụ đánh giá</th><th>CLO</th><th class="r">Trọng số CLO</th><th class="r">Điểm tối đa</th></tr></thead><tbody>
      ${R.exams.flatMap(e => e.questions.map(q => `<tr><td>${e.component === 'CK' ? 'Cuối kỳ' : 'Quá trình'}</td><td>${esc(e.title)}: ${esc(q.label)}</td><td>${cloChip(q.clo, C)}</td><td class="r num">${pct(q.max / examMax(e))}</td><td class="r num">${fmt(q.max)}</td></tr>`)).join('') || '<tr><td colspan="5" class="hint">Chưa chọn thành phần nào.</td></tr>'}
    </tbody></table></div>

    <h3 style="margin:16px 0 8px">III. Kết quả đo lường từng sinh viên</h3>
    <div class="tw rep"><table>
      <thead><tr><th class="c">STT</th><th>Mã SV</th><th>Họ và tên</th>${course ? '<th>Lớp HP</th>' : ''}${R.clos.map(c => `<th class="c">${c.id}<div class="num" style="text-transform:none">${fmt1(c.max)}</div></th>`).join('')}<th class="c">CLO chưa đạt</th><th>Ghi chú</th></tr></thead>
      <tbody>${R.rows.map((r, i) => `<tr><td class="c num">${i + 1}</td><td class="num">${r.s.id}</td><td style="white-space:nowrap"><a href="#" data-act="profile" data-id="${r.s.id}" style="font-weight:700;text-decoration:underline;text-decoration-color:var(--berry)">${esc(r.s.name)}</a></td>
        ${course ? `<td>${esc(clsOf(r.s.id))}</td>` : ''}
        ${R.clos.map(c => { const m = r.mx[c.id]; return `<td class="c num ${m ? (r.sc[c.id] >= m * C.threshold / 100 ? 'ok' : 'no') : ''}">${m ? fmt(r.sc[c.id]) + (m !== c.max ? `<span class="faint">/${fmt(m)}</span>` : '') : '<span class="faint">–</span>'}</td>`; }).join('')}
        <td class="c num"><b>${r.fail}</b></td><td class="hint">${[r.missing ? `thiếu ${r.missing} bài` : '', r.pending ? `${r.pending} câu chờ chấm` : ''].filter(Boolean).join(', ')}</td></tr>`).join('')}</tbody>
      <tfoot>
        ${[['Điểm tối đa của CLO', c => fmt1(c.max)], [`Điểm tối thiểu đạt CLO (${C.threshold}%)`, c => fmt1(c.need)], ['Số sinh viên được đo', c => c.n], ['Tổng số sinh viên đạt CLO', c => c.pass], ['Tỷ lệ sinh viên đạt CLO', c => pct(c.rate)]]
          .map(([t, f]) => `<tr><td colspan="${course ? 4 : 3}">${t}</td>${R.clos.map(c => `<td class="c num">${c.max ? f(c) : '–'}</td>`).join('')}<td colspan="2"></td></tr>`).join('')}
      </tfoot></table></div>

    <h3 style="margin:16px 0 8px">IV. Mức đạt được của CLO</h3>
    <div class="tw"><table><thead><tr><th>CLO</th><th class="c">Vượt kỳ vọng</th><th class="c">Đạt kỳ vọng</th><th class="c">Đạt tối thiểu</th><th class="c">Không đạt</th><th>Phân bố</th></tr></thead><tbody>
      ${R.clos.filter(c => c.max).map(c => { const n = c.n || 1; return `<tr><td>${cloChip(c.id, C)}</td>${['exceed','expect','min','fail'].map(k => `<td class="c num">${c.L[k]} <span class="faint">(${pct(c.L[k] / n)})</span></td>`).join('')}
        <td><div class="lvbar">${['exceed','expect','min','fail'].map(k => c.L[k] ? `<i style="flex:${c.L[k]};background:${LV[k]}"></i>` : '').join('')}</div></td></tr>`; }).join('')}
    </tbody></table></div>
    <label class="f" style="margin-top:16px">Kết luận và đề xuất cải tiến
      <textarea class="in" id="rep_note" data-scope="${course ? 'course' : 'sec'}" style="min-height:110px">${esc(note ?? (weak.length
        ? `Các CLO có tỷ lệ sinh viên đạt dưới mục tiêu: ${weak.map(c => `${c.id} (${pct(c.rate)})`).join(', ')}. Đề xuất tăng cường hoạt động thực hành và phản hồi định kỳ cho các nội dung tương ứng.`
        : R.clos.some(c => c.max) ? 'Tất cả CLO được đo đều đạt mục tiêu kỳ vọng.' : ''))}</textarea></label>
  </div>
  ${course ? `<div class="card stack" style="margin-top:18px"><h3>So sánh giữa các lớp học phần</h3>
    <div class="tw"><table><thead><tr><th>Lớp</th><th>Học kỳ</th><th class="c">SV</th>${R.clos.map(c => `<th class="c">${c.id}</th>`).join('')}</tr></thead><tbody>
    ${secs.map(s => { const r = cloReport(C, S.repExams.filter(id => DB.exams.find(e => e.id === id)?.sectionIds.includes(s.id)), s.students);
      return `<tr><td><b>${esc(s.cls)}</b></td><td>${esc(termKey(s))}</td><td class="c num">${s.students.length}</td>${r.clos.map(c => `<td class="c num">${c.n ? `<span class="chip ${c.met ? 'c-mint' : 'c-bad'}">${pct(c.rate)}</span>` : '<span class="faint">–</span>'}</td>`).join('')}</tr>`; }).join('')}
    </tbody></table></div><p class="hint">Mỗi lớp chỉ tính các đề đã giao cho lớp đó trong số đề được chọn ở trên.</p></div>` : ''}

`;
}

function cloBars(C, R, r) {
  if (!r) return '<p class="hint">Chưa có đề nào được giao.</p>';
  return R.clos.filter(c => r.mx[c.id]).map(c => { const m = r.mx[c.id], x = r.sc[c.id] / m; return `
    <div class="stack" style="gap:5px"><div class="row" style="justify-content:space-between">${cloChip(c.id, C)}<span class="num"><b>${fmt(r.sc[c.id])}</b>/${fmt(m)} · ${pct(x)}</span></div>
    <div class="bar" style="position:relative"><i style="width:${Math.min(100, x * 100)}%;background:${x * 100 >= C.threshold ? 'var(--mint)' : 'var(--bad)'}"></i><b style="position:absolute;top:-3px;bottom:-3px;left:${C.threshold}%;width:2px;background:var(--line)"></b></div>
    <span class="hint">${esc(c.desc)}</span></div>`; }).join('') || '<p class="hint">Chưa có điểm.</p>';
}
function profileModal(svId) {
  const st = DB.students.find(s => s.id === svId);
  const secs = DB.sections.filter(s => s.students.includes(svId)).sort(termSort);
  modal(`<div class="stack">
    <div><span class="eyebrow">Hồ sơ CLO</span><h2>${esc(st.name)}</h2><span class="hint num">${st.id} · ${esc(st.cls)} · ${secs.length} lớp học phần</span></div>
    ${secs.map(s => { const C = COURSE(s.courseId), R = cloReport(C, measuredExams(C.id, svId), [svId]);
      return `<div class="stack" style="gap:10px;padding-top:12px;border-top:2px solid var(--hair)"><b>${esc(C.name)} · ${esc(s.cls)} <span class="hint">(${esc(termKey(s))})</span></b>${cloBars(C, R, R.rows[0])}</div>`; }).join('')}
    <button class="btn" data-act="closeModal">Đóng</button></div>`, true);
}

/* ================== GV · DANH SÁCH LỚP ================== */
function gvStudents() {
  const sec = SEC(), C = CUR(), ex = secExams(sec).filter(e => !['draft','scheduled'].includes(phase(e)));
  const R = cloReport(C, ex.map(e => e.id), sec.students);
  const q = (S.stQ || '').toLowerCase();
  const byId = Object.fromEntries(R.rows.map(r => [r.s.id, r]));
  const list = sec.students.map(id => DB.students.find(s => s.id === id)).filter(Boolean)
    .filter(s => !q || s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q))
    .sort((a, b) => a.name.split(' ').pop().localeCompare(b.name.split(' ').pop(), 'vi') || a.name.localeCompare(b.name, 'vi'));
  const t = sec.template;
  return `
  ${pageHead('Danh sách lớp học phần', `Lớp ${esc(sec.cls)}`, secSub())}
  <div class="toolbar">
    <button class="btn pri" data-act="importXls">Nhập từ tệp .xls của trường</button>
    <button class="btn sky" data-act="exportXls">Xuất điểm quá trình (.xls)</button>
    <button class="btn ghost" data-act="quickAdd">Thêm nhanh</button>
    <button class="btn ghost" data-act="copyFromModal">Chép từ lớp khác</button>
    <input class="in" id="stQ" placeholder="Tìm tên hoặc MSSV…" value="${esc(S.stQ || '')}" style="max-width:240px;margin-left:auto">
  </div>
  <p class="hint" style="margin:-4px 0 12px">${t ? `Tệp mẫu của lớp: <b>${esc(t.name)}</b> · ${Object.keys(t.rowMap).length} SV trong tệp${t.lastExport ? ` · xuất điểm lần cuối ${dt(t.lastExport.at)}` : ''}` : 'Chưa có tệp mẫu của trường cho lớp này – nhập danh sách bằng tệp .xls để xuất điểm ngược lại đúng mẫu.'}</p>
  <div class="tw"><table class="compact roster">
    <thead><tr><th class="c">STT</th><th>MSSV</th><th>Họ đệm</th><th>Tên</th><th>Lớp SH</th><th class="c">Bài đã nộp</th><th class="c">CLO chưa đạt</th><th></th></tr></thead>
    <tbody>${list.map((s, i) => { const r = byId[s.id], parts = s.name.split(' '), ten = parts.pop();
      const nSub = DB.subs.filter(x => x.svId === s.id && x.submittedAt && ex.some(e => e.id === x.examId)).length;
      return `<tr><td class="c num">${i + 1}</td><td class="num">${esc(s.id)}</td><td>${esc(parts.join(' '))}</td><td><b>${esc(ten)}</b></td>
        <td>${esc(s.cls)}${s.cls !== sec.cls ? ' <span class="chip c-peach" style="font-size:10.5px">ghép</span>' : ''}</td>
        <td class="c num">${nSub}/${ex.filter(e => e.assigned.includes(s.id)).length}</td>
        <td class="c">${r ? `<span class="chip ${r.fail ? 'c-bad' : 'c-mint'} num">${r.fail}</span>` : '<span class="faint">–</span>'}</td>
        <td class="r" style="white-space:nowrap"><button class="btn sm ghost" data-act="profile" data-id="${s.id}">Hồ sơ CLO</button> ${window.KHAOTHI_API ? `<button class="btn sm ghost" data-act="resetPw" data-id="${s.id}" title="Đặt lại mật khẩu về MSSV">Đặt lại MK</button> ` : ''}<button class="btn sm ghost" data-act="rmFromSec" data-id="${s.id}" title="Rút khỏi lớp">Rút</button></td></tr>`; }).join('') || '<tr><td colspan="8" class="hint">Không có sinh viên phù hợp.</td></tr>'}
    </tbody></table></div>`;
}
function quickAddModal() {
  modal(`<div class="stack"><h2>Thêm nhanh vào lớp ${esc(SEC().cls)}</h2>
    <p class="hint">Dán từ Excel, mỗi dòng: MSSV, Họ và tên, (Lớp sinh hoạt). Sinh viên đã có trong hệ thống được dùng lại theo MSSV.</p>
    <textarea class="in" id="sv_bulk" style="min-height:180px" placeholder="051207019280	Phạm Bùi Thành An	DCT25A"></textarea>
    <div class="row"><button class="btn pri" data-act="addSv">Thêm vào lớp</button><button class="btn ghost" data-act="closeModal">Đóng</button></div></div>`);
}
function copyFromModal() {
  const sec = SEC();
  modal(`<div class="stack"><h2>Chép danh sách từ lớp khác</h2>
    <p class="hint">Dùng khi cùng một lớp sinh hoạt học nhiều học phần của cô.</p>
    <select class="in" id="copyFrom">${mySections().filter(s => s.id !== sec.id).sort(termSort).map(s => `<option value="${s.id}">${esc(secName(s))} · ${esc(termKey(s))} (${s.students.length} SV)</option>`).join('')}</select>
    <div class="row"><button class="btn pri" data-act="copyRoster">Thêm các sinh viên này</button><button class="btn ghost" data-act="closeModal">Đóng</button></div></div>`);
}

/* ================== GV · HỌC PHẦN & LỚP ================== */
function gvCourses() {
  const mine = mySections();

/* Gửi tới Apps Script: POST text/plain (yêu cầu đơn giản, không cần preflight); đọc được phản hồi JSON nếu trình duyệt cho phép */
async function gas(payload) {
  const url = DB.settings.sheetUrl; if (!url) throw new Error('Chưa có URL Apps Script.');
  const body = JSON.stringify({...payload, token: DB.settings.token || ''});
  try { const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body}); const j = await r.json(); if (!j.ok) throw new Error(j.error || 'Apps Script báo lỗi'); return j; }
  catch (e) { if (/token|Apps Script báo lỗi|Mã bảo mật/i.test(e.message)) throw e; await fetch(url, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body}); return {ok: true, blind: true}; }
}

<script>
/* ================== SV · BÀI ĐƯỢC GIAO ==================
   Thiết kế cho trường hợp nhiều môn, nhiều bài: mỗi môn một màu nhận diện; tab "Cần làm" xếp theo độ gấp

const CC = ['berry','sky','mint','lemon','grape','peach'];
const courseTone = cid => CC[Math.max(0, DB.courses.findIndex(c => c.id === cid)) % CC.length];
const svSections = me => DB.sections.filter(s => s.students.includes(me));
function svItems(me) {
  const now = Date.now();
  return DB.exams.filter(e => phase(e) !== 'draft' && e.assigned.includes(me)).map(e => {
    const sec = svSections(me).find(s => e.sectionIds.includes(s.id));
    const sub = DB.subs.find(s => s.examId === e.id && s.svId === me);
    const oral = e.questions.every(q => q.type === 'VD');
    const st = sub?.submittedAt ? 'done' : sub ? 'doing' : oral ? 'oral' : phase(e) === 'closed' ? 'closed' : phase(e) === 'ended' ? 'late' : phase(e) === 'scheduled' ? 'soon' : 'todo';
    return {e, sec, sub, st, oral, archived: !!sec?.archived, due: e.closesAt || null};
  }).filter(x => x.sec);
}
function dueChip(x) {
  if (x.st === 'done') return `<span class="due faint num">nộp ${dt(x.sub.submittedAt).slice(-10)}</span>`;
  if (x.st === 'doing') { const left = deadline(x.e, x.sub) - Date.now(); return `<span class="due num ${left < 36e5 ? 'urgent' : ''}" style="color:var(--sky-t);font-weight:700">còn ${left <= 0 ? '0' : left > 864e5 * 2 ? Math.round(left / 864e5) + ' ngày' : left > 36e5 ? Math.round(left / 36e5) + ' giờ' : fmtLeft(left)}</span>`; }
  if (x.st === 'soon') return `<span class="due num" style="color:var(--sky);font-weight:700">mở ${dt(x.e.opensAt).replace(' ', ' · ')}</span>`;
  if (!x.due) return '<span class="due faint">không hạn</span>';
  const h = (x.due - Date.now()) / 36e5;
  if (h < 0) return `<span class="due faint num">hạn ${dt(x.due).slice(-10)}</span>`;
  return `<span class="due num ${h < 24 ? 'urgent' : ''}" style="${h < 72 ? 'color:var(--peach-t);font-weight:700' : ''}">${h < 1 ? 'còn ' + Math.max(1, Math.round(h * 60)) + ' phút' : h < 48 ? 'còn ' + Math.round(h) + ' giờ' : 'còn ' + Math.round(h / 24) + ' ngày'}</span>`;
}
const ST_SV = {soon:['Sắp mở','c-sky'], todo:['Chưa làm','c-sky'], doing:['Đang làm','c-lemon'], done:['Đã nộp','c-mint'], late:['Quá hạn','c-bad'], closed:['Đã đóng','c-plain'], oral:['Vấn đáp','c-peach']};
function svRow(x, showCourse) {
  const urgent = x.st === 'todo' && x.due && x.due - Date.now() < 864e5;
  const C = COURSE(x.e.courseId), tone = courseTone(C.id), p = x.sub?.submittedAt ? pendingQs(x.e, x.sub).length : 0;

    : x.st === 'todo' ? `<button class="btn sm ${urgent ? 'pri attn-warn' : 'sky'}" data-act="startExam" data-id="${x.e.id}">Làm bài</button>` : '';
  return `<div class="svrow ${x.sub?.locked && x.st === 'doing' ? 'hot' : x.st === 'doing' ? 'doing' : ''}" style="--tone:var(--${tone})">
    ${showCourse ? `<span class="ctag" style="background:var(--${tone}-s)" title="${esc(C.name)}">${esc(C.code)}</span>` : ''}
    <div class="svmain"><b>${esc(x.e.title)}</b><span class="hint">${showCourse ? esc(C.name) + ' · ' : ''}${examLabel(x.e)} · ${x.e.questions.length} câu · ${x.e.duration >= 1440 ? Math.round(x.e.duration / 1440) + ' ngày' : x.e.duration + ' phút'}${P_(x.e).mode === 'free' ? ' · tự do' : ''}</span></div>
    ${dueChip(x)}<span class="chip ${ST_SV[x.st][1]}">${ST_SV[x.st][0]}</span><div class="svact">${act}</div></div>`;

function svMine() {

  </div>

    return `<button class="${cf === cid ? 'on' : ''}" data-act="svCourse" data-v="${cid}" style="--tone:var(--${courseTone(cid)})"><i></i>${esc(C.name)}${n ? `<span class="count num">${n}</span>` : ''}</button>`; }).join('')}</div>
  ${!pool.length && !(tab === 'todo' && soonL.length) ? `<div class="empty">${tab === 'todo' ? 'Không còn bài nào cần làm.' : 'Không có bài nào.'}</div>`
    : tab === 'todo' ? `<div class="svlist">${pool.map(x => svRow(x, true)).join('')}</div>${soonL.filter(x => cf === 'all' || x.e.courseId === cf).length ? `<h3 style="margin:18px 0 8px">Sắp mở</h3><div class="svlist">${soonL.filter(x => cf === 'all' || x.e.courseId === cf).map(x => svRow(x, true)).join('')}</div>` : ''}`

        return `<details class="cgroup" open style="--tone:var(--${tone})"><summary><i></i><b>${esc(C.name)}</b><span class="hint">Lớp ${esc(sec.cls)} · ${esc(termKey(sec))} · ${xs.length} bài</span></summary>
          <div class="svlist">${xs.map(x => svRow(x, false)).join('')}</div></details>`; }).join('')}`;
