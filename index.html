<script>
/* ================== CHẾ ĐỘ TRIỂN KHAI: MÁY CHỦ GOOGLE APPS SCRIPT ==================
   Bật khi config.js khai báo window.KHAOTHI_API = 'https://script.google.com/macros/s/…/exec'.
   – Đăng nhập: GV bằng email + mật khẩu; SV bằng MSSV, mật khẩu mặc định là MSSV, tự đổi được.
   – Danh mục (học phần, lớp, SV, đề): GV gửi phần thay đổi theo từng mục; máy khác nhận qua số phiên bản.
   – Bài làm: SV ghi phần của SV (bài làm, rời trình duyệt); GV ghi phần của GV (điểm, mở khóa, cộng giờ).
     Hai bên hỏi máy chủ vài giây một lần nên trạng thái khóa/mở khóa, nộp bài, điểm hiện gần như tức thì.
   – Danh sách bài ở máy GV chỉ có bản tóm tắt; bài làm đầy đủ và ảnh được tải khi mở chấm hoặc khi đóng gói. */
const REMOTE = (() => {
  const API = window.KHAOTHI_API;
  const R = {on: !!API, sid: null, catVer: 0, since: 0, lastCat: {}, lastSettings: '', base: {}, svSent: {}, svDone: {}, hid: [],
             saveT: null, pollT: null, pollAt: 0, syncing: null, again: false, fail: 0, isDefault: false, loading: {}, skew: 0, bypass: false, badge: null};
  if (!API) return {R, start() {}};
  const SK_SID = 'khaothi_api_sid', SK_ME = 'khaothi_api_me', BK = 'khaothi_bk_';
  const ENT = ['courses', 'sections', 'teachers', 'students', 'exams'];
  const SEP = '\u0001';
  loginRole = 'sv';

  /* ---------- gọi máy chủ ---------- */
  async function call(action, data = {}, opt = {}) {
    const body = JSON.stringify({...data, action, sid: R.sid});
    let res, j, lastErr;
    // Google đôi khi trả 404/5xx thoáng qua (quá tải, liên kết chuyển tiếp hết hạn) → tự thử lại tối đa 3 lần
    for (let k = 0; k < 3 && !j; k++) {
      if (k) await new Promise(r => setTimeout(r, 800 * k));
      try { res = await fetch(API, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body, cache: 'no-store', keepalive: !!opt.keepalive && body.length < 60000}); }
      catch (e) { lastErr = new Error('Không kết nối được máy chủ.'); continue; }
      try { j = await res.json(); } catch (e) { lastErr = new Error(`Máy chủ trả lời không hợp lệ (HTTP ${res.status}).`); }
    }
    if (!j) { lastErr.net = true; throw lastErr; }
    if (j.now) R.skew = j.now - Date.now();
    if (!j.ok) { const er = new Error(j.error || 'Máy chủ báo lỗi.'); er.code = j.code; if (j.code === 'AUTH' && action !== 'login') authLost(); throw er; }
    return j;
  }
  const blankDB = () => ({courses: [], sections: [], teachers: [], students: [], exams: [], subs: [], settings: {judgeUrl: '', archiveEmail: '', sheetUrl: API}, me: null});
  const roleStore = role => role === 'gv' ? localStorage : sessionStorage;
  function saveSid() { try { [localStorage, sessionStorage].forEach(s => { s.removeItem(SK_SID); s.removeItem(SK_ME); }); const st = roleStore(DB.me?.role || R.role); st.setItem(SK_SID, R.sid); if (DB.me) st.setItem(SK_ME, JSON.stringify(DB.me)); } catch (e) {} }
  function clearSid() { try { [localStorage, sessionStorage].forEach(s => { s.removeItem(SK_SID); s.removeItem(SK_ME); }); } catch (e) {} }
  function authLost() {
    if (!R.sid) return;
    R.sid = null; clearSid(); clearTimeout(R.pollT); clearTimeout(R.saveT); R.saveT = null;
    DB = blankDB(); S.view = ''; closeModal(); render(); badge(null);
    toast('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại. Bài làm dở vẫn được giữ trên máy này.');
  }

  /* ---------- trạng thái mạng ---------- */
  function badge(state, text) {
    let b = document.getElementById('netBadge');
    if (!state || !DB?.me) { b?.remove(); R.badge = null; return; }
    R.badge = [state, text];
    if (!b) { b = document.createElement('div'); b.id = 'netBadge'; b.setAttribute('role', 'status'); document.body.appendChild(b); }
    b.className = state === 'ok' ? '' : state; b.innerHTML = `<i></i>${esc(text)}`;
  }

  /* ---------- danh mục: so sánh theo từng mục ---------- */
  const entStr = (k, x) => JSON.stringify(k === 'sections' && x.template ? {...x, template: {...x.template, b64: undefined}} : x);
  function snapshot() { const m = {}; ENT.forEach(k => (DB[k] || []).forEach(x => { m[k + SEP + x.id] = entStr(k, x); })); return m; }
  const settingsStr = () => JSON.stringify({archiveEmail: DB.settings.archiveEmail || '', judgeUrl: DB.settings.judgeUrl || ''});
  const sigOf = s => (s || '').length + ':' + (s || '').slice(-24);

  /* ---------- bài làm: phần SV / phần GV ---------- */
  const EMPTY_GV = {scores: {}, feedback: {}, runs: {}, extraMin: 0, unlocks: [], forcedAt: null};
  const stub = list => Object.fromEntries((list || []).map(q => [q, '·']));
  function gvPart(s) {
    return {scores: s.scores || {}, feedback: s.feedback || {}, runs: s.runs || {}, extraMin: s.extraMin || 0,
      unlocks: (s.leaves || []).filter(L => L.back && !L.auto && L.unlockedAt).map(L => ({at: L.unlockedAt, by: L.unlockedBy || ''})),
      forcedAt: s.forcedAt || null, flag: s.forcedAt ? (s.flag || '') : ''};
  }
  const nv = v => (v === '' || v === undefined) ? null : v;
  function gvDiff(g, b) {
    b = b || EMPTY_GV; const d = {}; let any = false;
    for (const k of ['scores', 'feedback', 'runs']) {
      const a = g[k] || {}, z = b[k] || {}, o = {}; let ch = false;
      for (const q of new Set([...Object.keys(a), ...Object.keys(z)])) if (JSON.stringify(nv(a[q])) !== JSON.stringify(nv(z[q]))) { o[q] = nv(a[q]); ch = true; }
      if (ch) { d[k] = o; any = true; }
    }
    if ((g.extraMin || 0) !== (b.extraMin || 0)) { d.extraMin = g.extraMin || 0; any = true; }
    if (g.unlocks.length > (b.unlocks || []).length) { d.unlocks = g.unlocks; any = true; }
    if (g.forcedAt && !b.forcedAt) { d.forcedAt = g.forcedAt; d.flag = g.flag; any = true; }
    return any ? d : null;
  }
  function applyGv(s, gv) {
    gv = gv || {};
    s.scores = {...(gv.scores || {})}; s.feedback = {...(gv.feedback || {})}; s.runs = {...(gv.runs || {})};
    s.extraMin = gv.extraMin || 0; s._unlocks = gv.unlocks || []; s.forcedAt = gv.forcedAt || null; s.graded = !!gv.graded;
    if (gv.forcedAt && !s.flag) s.flag = gv.flag || '';
  }
  function applyDiff(s, d) {
    for (const k of ['scores', 'feedback', 'runs']) if (d[k]) for (const [q, v] of Object.entries(d[k])) { if (v == null) delete s[k][q]; else s[k][q] = v; }
    if (d.extraMin != null) s.extraMin = d.extraMin;
    if (d.unlocks) s._unlocks = d.unlocks;
    if (d.forcedAt) { s.forcedAt = d.forcedAt; s.flag = s.flag || d.flag; }
  }
  // Khóa = số lần quay lại (không tự mở) nhiều hơn số lần GV mở khóa
  function applyLock(s) {
    const ul = s._unlocks || []; let k = 0;
    (s.leaves || []).forEach(L => { if (!L.back || L.auto) return; const u = ul[k++]; if (u) { L.unlockedAt = u.at; L.unlockedBy = u.by; } else { delete L.unlockedAt; delete L.unlockedBy; } });
    if (!s.submittedAt && s.forcedAt) s.submittedAt = s.forcedAt;
    s.locked = !s.submittedAt && k > ul.length;
    if (s.submittedAt) s.away = false;
  }
  function markSig(s) { Object.values(s.answers || {}).forEach(v => v?.imgs?.forEach(im => { if (im.fileId && im.src) im._sig = sigOf(im.src); })); }
  function fromRow(row, full) {
    const sv = row.sv || {};
    const s = {id: row.id, examId: row.examId, svId: row.svId, startedAt: sv.startedAt || null, submittedAt: sv.submittedAt || null,
      leaves: sv.leaves || [], away: !!sv.away, pasteBlocked: sv.pasteBlocked || 0, flag: sv.flag || '',
      answers: full ? (row.answers || {}) : stub(sv.answered), _stub: !full, _nAtt: sv.nAtt || 0, _upd: row.upd};
    applyGv(s, row.gv); applyLock(s); if (full) markSig(s);
    return s;
  }
  function svPart(s) {
    const answers = {};
    for (const [q, v] of Object.entries(s.answers || {})) {
      if (v && typeof v === 'object') answers[q] = {...v, imgs: (v.imgs || []).map(im => {
        const o = {...im};
        if (o.fileId && (!o.src || o._sig === sigOf(o.src))) delete o.src; else { delete o.fileId; o.k = im.k ||= uid('i'); }
        delete o._sig; return o; })};
      else answers[q] = v;
    }
    return {startedAt: s.startedAt, submittedAt: s.submittedAt || null, away: !!s.away, pasteBlocked: s.pasteBlocked || 0, flag: s.flag || '',
      leaves: (s.leaves || []).map(L => { const o = {...L}; if (!o.auto) { delete o.unlockedAt; delete o.unlockedBy; } return o; }), answers};
  }
  const copySv = (o, s) => { ['startedAt', 'leaves', 'away', 'pasteBlocked', 'answers', 'flag'].forEach(k => { s[k] = o[k]; }); if (o.submittedAt) s.submittedAt = o.submittedAt; };

  /* ---------- GV: hợp nhất một dòng bài làm từ máy chủ ---------- */
  function mergeRow(row) {
    let s = DB.subs.find(x => x.examId === row.examId && x.svId === row.svId);
    if (!s) { s = fromRow(row, false); DB.subs.push(s); R.base[s.id] = row.gv || {}; return true; }
    if (s._upd === row.upd && s.id === row.id) return false;
    if (s.id !== row.id) { R.base[row.id] = R.base[s.id]; delete R.base[s.id]; if (S.subId === s.id) S.subId = row.id; s.id = row.id; }

  /* ---------- tải dữ liệu sau đăng nhập ---------- */
  function gvBoot(r, prev) {

    DB.settings = {...blankDB().settings, ...(r.catalog.settings || {}), sheetUrl: API};

    R.lastCat = snapshot(); R.lastSettings = settingsStr(); R.catVer = r.catVer; R.since = r.now - 5000;
  }
  function svBoot(r, keep) {

  async function boot(prev) {

  /* ---------- ghi lên máy chủ ---------- */
  async function syncGv() {
    for (const sec of DB.sections) {
      const t = sec.template;
      if (t?.b64 && t._up !== sigOf(t.b64)) { const r = await call('saveTemplate', {secId: sec.id, name: t.name, b64: t.b64, old: t.fileId || ''}); t.fileId = r.fileId; t._up = sigOf(t.b64); }
    }
    const cur = snapshot(), up = {}, rm = {}, sent = [];
    for (const [k, j] of Object.entries(cur)) if (R.lastCat[k] !== j) { const [t] = k.split(SEP); (up[t] ||= []).push(JSON.parse(j)); sent.push(k); }
    for (const k of Object.keys(R.lastCat)) if (!(k in cur)) { const [t, id] = k.split(SEP); (rm[t] ||= []).push(id); sent.push(k); }
    const st = settingsStr(), stCh = st !== R.lastSettings;
    if (sent.length || stCh) {
      const r = await call('saveCatalog', {up, rm, settings: stCh ? JSON.parse(st) : null});
      sent.forEach(k => { if (k in cur) R.lastCat[k] = cur[k]; else delete R.lastCat[k]; });
      R.lastSettings = st; R.catVer = r.catVer;
    }
    const items = [];
    for (const s of DB.subs) {
      const d = gvDiff(gvPart(s), R.base[s.id]); if (!d) continue;
      items.push({examId: s.examId, svId: s.svId, id: s.id, patch: d, create: R.base[s.id] ? null : {startedAt: s.startedAt, submittedAt: s.submittedAt}});
    }
    for (let i = 0; i < items.length; i += 25) {
      const r = await call('patchSubs', {items: items.slice(i, i + 25)});
      r.rows.forEach(row => { const s = DB.subs.find(x => x.examId === row.examId && x.svId === row.svId); if (s) s._upd = -1; mergeRow(row); });

  function backupSv() {

  async function syncSv(opt) {
    backupSv();

      if (R.svDone[s.id]) continue;
      const p = svPart(s), j = JSON.stringify(p); if (R.svSent[s.id] === j) continue;
      const sentId = s.id;
      let r;
      try { r = await call('saveSub', {id: s.id, sub: {examId: s.examId, ...p}}, opt); }
      catch (e) { if (e.net || e.code === 'AUTH') throw e; R.svSent[sentId] = j; toast('Không lưu được bài: ' + e.message); continue; }
      const unchanged = JSON.stringify(svPart(s)) === j;
      Object.values(s.answers || {}).forEach(v => v?.imgs?.forEach(im => { if (im.k && r.fids?.[im.k] && !im.fileId) { im.fileId = r.fids[im.k]; im._sig = sigOf(im.src); } }));
      if (r.id && r.id !== s.id) { delete R.svSent[s.id]; s.id = r.id; }
      R.svSent[s.id] = unchanged ? JSON.stringify(svPart(s)) : j; R.lastSave = Date.now();

  function svAdopt(s, row) {

    applyLock(s);
    if (S.view === 'take' && S.svExam === s.examId) {
      if (s.submittedAt && !was) { closeModal(); SK = null; S.svExam = null; setView('myresults'); toast(s.flag ? 'Bài đã được nộp: ' + s.flag : 'Bài làm đã được nộp.'); sync(); }

    }
  }
  // Gom thay đổi: lần sửa đầu hẹn lưu sau vài giây, các lần sửa tiếp theo đi chung chuyến đó (gõ liên tục vẫn được lưu đều)
  function later(ms) { if (R.saveT) return; R.saveT = setTimeout(() => { R.saveT = null; sync(); }, ms); }
  async function sync(opt = {}) {
    if (!DB?.me || !R.sid) return;

    clearTimeout(R.saveT); R.saveT = null;
    R.syncing = (async () => {
      badge('busy', 'Đang lưu…');
      try {
        if (DB.me.role === 'gv') await syncGv(); else await syncSv(opt);
        R.fail = 0; badge('ok', 'Đã lưu ' + hm(Date.now()));
      } catch (e) {
        if (e.code === 'AUTH') return;
        R.fail++;
        badge('off', e.net ? (DB.me?.role === 'sv' ? 'Mất kết nối – bài vẫn giữ trên máy, đang thử lại' : 'Mất kết nối – đang thử lại') : 'Lỗi lưu: ' + e.message);
        if (!e.net && R.fail === 1) toast('Chưa lưu được lên máy chủ: ' + e.message);

  }

  /* ---------- hỏi máy chủ định kỳ ---------- */
  const typing = () => { const a = document.activeElement; return !!a && a.matches?.('input,textarea,select') && !!a.closest('#root,#layer'); };
  function schedulePoll(ms) {
    if (!DB?.me || !R.sid) return;
    const gv = DB.me.role === 'gv';
    ms ??= gv ? (['monitor', 'grade'].includes(S.view) ? 4000 : 15000) : (S.view === 'take' ? (curTake()?.sub.locked ? 3000 : 5000) : 15000);
    if (R.pollT && R.pollAt && R.pollAt <= Date.now() + ms) return;
    clearTimeout(R.pollT); R.pollAt = Date.now() + ms; R.pollT = setTimeout(poll, ms);
  }
  async function poll() {

    if (R.syncing) await R.syncing.catch?.(() => {});
    try {
      if (DB.me.role === 'gv') await pollGv(); else await pollSv();
      if (!R.fail && R.badge?.[0] !== 'busy') badge('ok', 'Đã đồng bộ ' + hm(Date.now()));
    } catch (e) { if (e.net) badge('off', 'Mất kết nối – đang thử lại'); }
    schedulePoll();
  }
  async function pullCatalog() {
    const r = await call('catalog'), cat = r.catalog, local = snapshot();
    for (const k of ENT) {
      const srv = new Map((cat[k] || []).map(x => [x.id, x])), out = [];
      for (const x of DB[k]) {
        const key = k + SEP + x.id, clean = R.lastCat[key] === local[key];
        if (srv.has(x.id)) {
          const y = srv.get(x.id); srv.delete(x.id);
          if (clean) { if (k === 'sections' && x.template?.b64 && y.template?.fileId && y.template.fileId === x.template.fileId) y.template = {...y.template, b64: x.template.b64}; out.push(y); }
          else out.push(x);
          R.lastCat[key] = entStr(k, y);
        } else if (clean && key in R.lastCat) delete R.lastCat[key];      // đã bị xóa ở máy khác
        else { out.push(x); delete R.lastCat[key]; }                       // mục mới trên máy này, chưa gửi
      }
      for (const y of srv.values()) { const key = k + SEP + y.id; if (key in R.lastCat && !(key in local)) continue; out.push(y); R.lastCat[key] = entStr(k, y); }
      DB[k] = out;
    }
    DB.settings = {...DB.settings, ...(cat.settings || {}), sheetUrl: API}; R.lastSettings = settingsStr();

  }
  async function pollGv() {

    if (r.catVer && r.catVer !== R.catVer) { await pullCatalog(); ch = true; }

  }
  async function pollSv() {
    if (S.view === 'take' && Date.now() - (R.lastSave || 0) < 4000) return;     // vừa lưu xong: phản hồi lưu đã mang trạng thái mới

        <label class="f">Mật khẩu<input class="in" id="lg_pass" type="password" autocomplete="current-password" required></label>
        <button class="btn pri" type="submit" id="lg_btn">Vào hệ thống</button>
        <p class="hint">${gv ? 'Lần đầu đăng nhập dùng mật khẩu tạm được cấp, sau đó đổi mật khẩu.' : 'Lần đầu đăng nhập, mật khẩu chính là <b>MSSV</b> của bạn. Vào được rồi hãy đổi mật khẩu.'}</p>
        <p class="hint" id="lg_err" role="alert" style="color:var(--bad);font-weight:700"></p>
      </form>
    </div></div>`;
  };
  function pwModal(forced) {
    modal(`<form class="stack pwbox" id="pwForm" novalidate><span class="eyebrow">${DB.me.role === 'gv' ? esc(DB.me.email || DB.me.name) : 'MSSV ' + esc(DB.me.id)}</span><h2>Đổi mật khẩu</h2>
      ${forced ? '<p class="hint">Bạn đang dùng mật khẩu tạm, hãy đặt mật khẩu mới.</p>' : ''}
      <label class="f">Mật khẩu hiện tại <input class="in" id="pw_old" type="password" autocomplete="current-password" ${R.isDefault ? 'placeholder="Mật khẩu mặc định là MSSV"' : ''}></label>
      <label class="f">Mật khẩu mới (ít nhất 6 ký tự)<input class="in" id="pw_new" type="password" autocomplete="new-password"></label>
      <label class="f">Nhập lại mật khẩu mới<input class="in" id="pw_new2" type="password" autocomplete="new-password"></label>
      <p class="hint" id="pw_err" role="alert" style="color:var(--bad);font-weight:700"></p>
      <div class="row"><button class="btn pri" type="submit">Lưu mật khẩu</button><button class="btn ghost" type="button" data-act="closeModal">Để sau</button></div></form>`);
    $('#pw_old')?.focus();
  }
  gvConnect = function () {
    const st = DB.settings;
    return `
    ${pageHead('Cấu hình', 'Kết nối & dữ liệu', '')}
    <div class="grid g2">
      <div class="card stack"><h3>Máy chủ Google Apps Script</h3>
        <p class="hint">Dữ liệu lưu trong Google Sheet và Drive của khoa; mọi máy đăng nhập đều thấy cùng một dữ liệu, cập nhật sau vài giây.</p>
        <span class="hint num" style="overflow-wrap:anywhere">${esc(API)}</span>
        <div class="row"><button class="btn sm" data-act="rPing">Kiểm tra kết nối</button><button class="btn sm sky" data-act="rMirror">Đồng bộ ra bảng tính</button></div>
        <span class="hint" id="pingOut">Các trang tính dễ đọc (HocPhan, DeThi, BaiLam, Diem…) cũng tự dựng lại 10 phút một lần.</span>
        <hr class="sep"><h3>Tài khoản của tôi</h3>
        <p>${esc(DB.me.name)} · <span class="num">${esc(DB.me.email || '')}</span></p>
        <div class="row"><button class="btn sm" data-act="chgPw">Đổi mật khẩu</button></div>
        <hr class="sep"><h3>Giảng viên</h3>
        <div class="tw"><table class="compact"><tbody>${DB.teachers.map(t => `<tr><td><b>${esc(t.name)}</b><div class="hint num">${esc(t.email || '')}</div></td>
          <td class="r">${t.id !== DB.me.id && t.email ? `<button class="btn sm ghost" data-act="rResetGv" data-id="${esc(t.email)}">Cấp mật khẩu tạm</button>` : '<span class="hint">tôi</span>'}</td></tr>`).join('')}</tbody></table></div>
        <div class="row"><input class="in" id="t_email" type="email" placeholder="email@pdu.edu.vn" style="flex:1;min-width:160px"><input class="in" id="t_name" placeholder="Họ tên" style="flex:1;min-width:140px"><button class="btn sm mint" data-act="rAddTeacher">Thêm giảng viên</button></div>
      </div>
      <div class="card stack"><h3>Cấu hình chung</h3>
        <label class="f">Email nhận gói lưu trữ<input class="in" id="s_mail" type="email" value="${esc(st.archiveEmail || '')}"></label>
        <label class="f">Địa chỉ API chạy mã (Piston)<input class="in" id="s_judge" value="${esc(st.judgeUrl || '')}"></label>
        <div class="row"><button class="btn sm mint" data-act="rSaveCfg">Lưu cấu hình</button></div>
        <hr class="sep"><h3>Tài khoản sinh viên</h3>
        <p class="hint">Sinh viên đăng nhập bằng MSSV; mật khẩu mặc định là MSSV, sinh viên tự đổi sau khi vào. Quên mật khẩu: vào <b>Danh sách lớp</b>, bấm “Đặt lại MK” để đưa về MSSV.</p>
        <hr class="sep"><h3>Dữ liệu</h3>
        <p class="hint">${DB.courses.length} học phần · ${DB.sections.length} lớp học phần · ${DB.students.length} sinh viên · ${DB.exams.length} đề · ${DB.subs.filter(s => s.submittedAt).length} bài nộp</p>
        <div class="row"><button class="btn sm" data-act="exportJson">Sao lưu JSON</button>
          <label class="btn sm ghost" style="cursor:pointer">Nhập tệp sao lưu JSON<input type="file" id="rImportFile" accept=".json,application/json" hidden></label>
          <button class="btn sm ghost" data-act="rImportSample">Nạp dữ liệu mẫu để thử</button></div>
        <p class="hint">Tệp sao lưu JSON tải từ bản xem trước (nút “Sao lưu JSON” ở bản đó) chứa học phần, lớp, đề và bài làm. Dữ liệu được gộp theo mã, không xóa dữ liệu đang có; lớp của giảng viên khác trong tệp được gán cho cô.</p>
      </div>
    </div>`;
  };
  async function importData(data, label) {
    toast('Đang đưa dữ liệu lên máy chủ…');
    const r = await call('importAll', {data});
    const c = r.counts || {};
    await boot(DB.me); setView('connect');
    toast(`Đã nhập ${label}: ${c.courses || 0} học phần, ${c.sections || 0} lớp, ${c.students || 0} SV, ${c.exams || 0} đề, ${r.subs} bài làm.`);
  }

  /* ---------- sự kiện ---------- */
  document.addEventListener('submit', async ev => {
    if (ev.target.id === 'rLogin') {
      ev.preventDefault();
      const btn = $('#lg_btn'), err = $('#lg_err'); btn.disabled = true; btn.textContent = 'Đang đăng nhập…'; err.textContent = '';
      try {
        const r = await call('login', {role: loginRole, id: $('#lg_id').value.trim(), pw: $('#lg_pass').value});
        R.sid = r.sid; R.role = r.me.role;
        await boot(null);
        if (r.mustChange) pwModal(true);
      } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = 'Vào hệ thống'; }
    }
    if (ev.target.id === 'pwForm') {
      ev.preventDefault();
      const err = $('#pw_err'), a = $('#pw_new').value, b = $('#pw_new2').value;
      if (a.length < 6) { err.textContent = 'Mật khẩu mới cần ít nhất 6 ký tự.'; return; }
      if (a !== b) { err.textContent = 'Hai lần nhập mật khẩu mới chưa khớp.'; return; }
      if (DB.me.role === 'sv' && a.trim().toUpperCase() === DB.me.id.toUpperCase()) { err.textContent = 'Mật khẩu mới phải khác MSSV.'; return; }
      try { await call('changePw', {old: $('#pw_old').value, pw: a}); R.isDefault = false; closeModal(); render(); toast('Đã đổi mật khẩu.'); }
      catch (e) { err.textContent = e.message; }
    }
  });
  // Chặn trước một số thao tác cần dữ liệu đầy đủ từ máy chủ, tải xong mới cho chạy tiếp
  document.addEventListener('click', async ev => {
    const t = ev.target.closest('[data-act]'); if (!t || R.bypass) return;
    const A = t.dataset.act;
    if (A === 'logout' || A === 'rLogout') {
      ev.preventDefault(); ev.stopImmediatePropagation();
      if (DB?.me) { try { await sync(); } catch (e) {} if (DB.me.role === 'sv') backupSv(); }
      if (R.sid) call('logout').catch(() => {});
      R.sid = null; clearSid(); clearTimeout(R.pollT); clearTimeout(R.saveT); R.saveT = null;
      DB = blankDB(); S.view = ''; closeModal(); render(); return;
    }
    if (!DB?.me) return;
    let job = null;
    if (A === 'doArchive') { const ids = [...document.querySelectorAll('.archPick:checked')].map(x => x.value); job = () => loadFull(DB.exams.filter(e => e.sectionIds.some(x => ids.includes(x))).map(e => e.id)); }
    else if (A === 'dlArchive') { const sec = DB.sections.find(s => s.id === t.dataset.id); job = () => loadFull(secExams(sec).map(e => e.id)); }
    else if (A === 'exportJson' && DB.me.role === 'gv') job = () => loadFull(DB.exams.map(e => e.id));
    else if (A === 'exportXls' || A === 'expDo') { const tp = SEC()?.template; if (tp && !tp.b64 && tp.fileId) job = async () => { tp.b64 = (await call('getTemplate', {fileId: tp.fileId})).b64; tp._up = sigOf(tp.b64); }; }
    else if (A === 'startExam') { const E = DB.exams.find(x => x.id === t.dataset.id); if (E?._hidden) job = async () => { await refreshSv(); const E2 = DB.exams.find(x => x.id === t.dataset.id); if (!E2 || E2._hidden) throw new Error('Đề chưa đến giờ mở.'); }; }
    if (!job) return;
    ev.preventDefault(); ev.stopImmediatePropagation();
    t.disabled = true; toast('Đang tải dữ liệu từ máy chủ…');
    try { await job(); if (t.isConnected) { t.disabled = false; R.bypass = true; t.click(); } }
    catch (e) { toast(e.message); }
    finally { R.bypass = false; if (t.isConnected) t.disabled = false; }
  }, true);
  document.addEventListener('click', async ev => {
    const t = ev.target.closest('[data-act]'); if (!t || !DB?.me) return;
    const A = t.dataset.act, out = $('#pingOut');
    try {
      if (A === 'chgPw') pwModal(false);
      if (A === 'resetPw' && DB.me.role === 'gv') {
        if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Bấm lần nữa'; t.classList.add('pri'); return; }
        t.disabled = true; await call('resetPw', {role: 'sv', id: t.dataset.id});
        t.textContent = 'Đã đặt lại'; toast(`Mật khẩu của ${stName(t.dataset.id)} đã về mặc định (MSSV).`);
      }
      if (A === 'rPing') { out.textContent = 'Đang kiểm tra…'; const r = await call('ping'); out.textContent = `Kết nối được · máy chủ phiên bản ${r.version} · lệch giờ ${Math.round(R.skew / 1000)} giây`; }
      if (A === 'rMirror') { out.textContent = 'Đang dựng lại các trang tính…'; await sync(); const r = await call('mirror'); out.textContent = 'Đã đồng bộ: ' + Object.entries(r.counts).map(([k, v]) => v + ' ' + k).join(', ') + '.'; }
      if (A === 'rSaveCfg') { DB.settings.archiveEmail = $('#s_mail').value.trim(); DB.settings.judgeUrl = $('#s_judge').value.trim(); save(); toast('Đã lưu cấu hình.'); }
      if (A === 'rAddTeacher') {
        const email = $('#t_email').value.trim(), name = $('#t_name').value.trim();
        const r = await call('addTeacher', {email, name: name || email}); await sync(); await pullCatalog(); render();
        modal(`<div class="stack"><h2>Đã thêm giảng viên</h2><p>${esc(r.teacher.name)} · <b>${esc(r.teacher.email)}</b></p><p>Mật khẩu tạm: <b class="num" style="font-size:18px">${esc(r.tempPw)}</b></p><p class="hint">Gửi mật khẩu này cho giảng viên; lần đầu đăng nhập hệ thống sẽ yêu cầu đổi.</p><button class="btn" data-act="closeModal">Đóng</button></div>`);
      }
      if (A === 'rResetGv') {
        if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Bấm lần nữa'; t.classList.add('pri'); return; }
        const r = await call('resetPw', {role: 'gv', email: t.dataset.id});
        modal(`<div class="stack"><h2>Mật khẩu tạm mới</h2><p>${esc(t.dataset.id)}: <b class="num" style="font-size:18px">${esc(r.tempPw)}</b></p><button class="btn" data-act="closeModal">Đóng</button></div>`);
      }
      if (A === 'rImportSample') {
        if (t.dataset.confirm !== '1') { t.dataset.confirm = '1'; t.textContent = 'Bấm lần nữa để nạp (thêm 5 lớp mẫu)'; t.classList.add('pri'); return; }
        t.disabled = true; await sync(); await importData(seed(), 'dữ liệu mẫu');
      }
    } catch (e) { toast(e.message); if (out && ['rPing', 'rMirror'].includes(A)) out.textContent = e.message; t.disabled = false; }
  });
  document.addEventListener('change', async ev => {
    if (ev.target.id !== 'rImportFile' || !ev.target.files[0]) return;
    try { const data = JSON.parse(await ev.target.files[0].text()); if (!data.courses || !data.exams) throw new Error('Tệp không phải bản sao lưu của Khảo thí CLO.'); await sync(); await importData(data, ev.target.files[0].name); }
    catch (e) { toast('Không nhập được: ' + e.message); }
  });
  // Rời trang hoặc ẩn tab: gửi ngay phần chưa lưu (để GV thấy ngay SV rời trình duyệt)
  document.addEventListener('visibilitychange', () => { if (document.hidden && DB?.me && R.sid) sync({keepalive: true}); else if (!document.hidden && DB?.me && R.sid) schedulePoll(300); });
  window.addEventListener('pagehide', () => { if (DB?.me && R.sid) { if (DB.me.role === 'sv') backupSv(); sync({keepalive: true}); } });
  window.addEventListener('online', () => { if (DB?.me && R.sid) { sync(); schedulePoll(300); } });

  return {R, start, call, sync, poll, svPart, gvPart};
})();
</script>
<script>
/* ================== KHỞI ĐỘNG ==================
   Có config.js (KHAOTHI_API) → chạy với máy chủ Apps Script (p14_remote.js lo đăng nhập, tải dữ liệu, đồng bộ).
   Không có → bản xem trước, dữ liệu lưu trong trình duyệt. */
if (window.KHAOTHI_API) REMOTE.start();
else {
  DB = load() || seed(); save();
  S.view = DB.me ? (DB.me.role === 'gv' ? 'home' : 'mine') : '';
  render();
}
</script>
</body></html>
