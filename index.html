function svResults() {
  const me = DB.me.id, secs = svSections(me).sort(termSort);
  const card = (sec, open) => { const C = COURSE(sec.courseId), tone = courseTone(C.id);
    const subs = DB.subs.filter(s => s.svId === me && s.submittedAt && DB.exams.find(e => e.id === s.examId)?.courseId === C.id);
    // chỉ tính những bài đã nộp hoặc đề đã đóng – bài đang mở chưa làm không bị tính 0
    const R = cloReport(C, measuredExams(C.id, me), [me]), r = R.rows[0];
    const measured = r ? R.clos.filter(c => r.mx[c.id]) : [], ok = measured.filter(c => r.sc[c.id] >= r.mx[c.id] * C.threshold / 100).length;
    return `<details class="cgroup" ${open ? 'open' : ''} style="--tone:var(--${tone})"><summary><i></i><b>${esc(C.name)}</b><span class="hint">Lớp ${esc(sec.cls)} · ${esc(termKey(sec))} · ${subs.length} bài đã nộp</span>
      ${measured.length ? `<span class="chip ${ok === measured.length ? 'c-mint' : 'c-lemon'} num" style="margin-left:auto">Đạt ${ok}/${measured.length} CLO</span>` : ''}</summary>
      <div class="split" style="padding:12px">
        <div class="svlist">${subs.map(sub => { const e = DB.exams.find(x => x.id === sub.examId), p = pendingQs(e, sub).length; return `
          <details class="svrow det"><summary><div class="svmain"><b>${esc(e.title)}</b><span class="hint">Nộp ${dt(sub.submittedAt)}</span></div>
            <span class="chip ${p ? 'c-lemon' : 'c-mint'} num">${p ? `chờ chấm ${p} câu` : fmt(subTotal(e, sub)) + '/' + fmt(examMax(e))}</span></summary>
            <div class="tw" style="margin-top:8px"><table><thead><tr><th>Câu</th><th>CLO</th><th class="r">Điểm</th><th>Nhận xét</th></tr></thead><tbody>
              ${e.questions.map(q => `<tr><td>${esc(q.label)}</td><td>${cloChip(q.clo, C)}</td><td class="r num">${sub.scores[q.id] == null ? '<span class="chip c-lemon">chờ</span>' : `${fmt(sub.scores[q.id])}/${fmt(q.max)}`}</td><td class="hint">${esc(sub.feedback?.[q.id] || '')}</td></tr>`).join('')}
            </tbody></table></div></details>`; }).join('') || '<div class="empty">Chưa nộp bài nào.</div>'}</div>
        <div class="stack"><b>Mức đạt CLO</b><span class="hint">Vạch đen là ngưỡng đạt ${C.threshold}%.</span>${cloBars(C, R, r)}</div>
      </div></details>`; };
  const cur = secs.filter(s => !s.archived), past = secs.filter(s => s.archived);
  return `
  ${pageHead(esc(DB.me.name), 'Kết quả của tôi', 'Bấm vào từng môn để xem điểm và mức đạt chuẩn đầu ra.')}
  ${cur.map((s, i) => card(s, i === 0)).join('') || '<div class="empty">Bạn chưa thuộc lớp học phần nào.</div>'}
  ${past.length ? `<h3 style="margin:22px 0 10px">Học kỳ trước</h3>${past.map(s => card(s, false)).join('')}` : ''}`;
}

/* ================== XUẤT DỮ LIỆU ================== */
function download(name, text, type = 'text/csv') {
  const blob = new Blob(['﻿' + text], {type: type + ';charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('Đã tạo tệp ' + name);
}
const csv = rows => rows.map(r => r.map(v => { const s = String(v ?? ''); return /[",\n;]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(',')).join('\n');
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '');
function examTable(e, sec) {
  const header = ['Mã SV', 'Họ và tên', 'Lớp HP', ...e.questions.map(q => `${q.label} (${q.clo}, ${q.max}đ)`), 'Tổng', 'Nộp lúc'];
  const rows = inSec(e, sec).map(id => { const sub = DB.subs.find(s => s.examId === e.id && s.svId === id);
    return [id, stName(id), sec.cls, ...e.questions.map(q => sub?.scores?.[q.id] ?? ''), sub?.submittedAt ? subTotal(e, sub) : '', sub?.submittedAt ? dt(sub.submittedAt) : '']; });
  return {header, rows};
}
function repTable() {
  const {C, secs, students, course} = repContext();
  const R = cloReport(C, S.repExams, students);
  const header = ['STT', 'Mã SV', 'Họ và tên', 'Lớp HP', ...R.clos.map(c => `${c.id} (/${fmt1(c.max)})`), 'Số CLO chưa đạt'];
  const rows = R.rows.map((r, i) => [i + 1, r.s.id, r.s.name, secs.filter(s => s.students.includes(r.s.id)).map(s => s.cls).join(', '), ...R.clos.map(c => r.sc[c.id]), r.fail]);
  rows.push(['', '', 'Tỷ lệ SV đạt CLO', '', ...R.clos.map(c => pct(c.rate)), '']);
  return {header, rows, name: `CLO_${C.code}_${course ? 'TOAN-HP' : secs[0].cls}`};
}
async function pushSheet(sheet, t) {
  try { await gas({action:'table', sheet, header: t.header, rows: t.rows}); toast(`Đã gửi “${sheet}” lên Google Sheet.`); return true; }
  catch (e) { toast(e.message.includes('URL') ? 'Chưa có URL Apps Script. Vào “Kết nối & dữ liệu” để cấu hình.' : 'Không gửi được: ' + e.message); return false; }
}

// Tự nộp bài làm dở khi hết thời lượng của SV hoặc khi đề hết giờ – chạy mỗi lần hiển thị
function autoSweep() {
  const n = Date.now(); let ch = false;
  DB.subs.forEach(s => { if (s.submittedAt || !s.startedAt) return; const e = DB.exams.find(x => x.id === s.examId); if (!e) return;
    const end = deadline(e, s); if (end <= n || phase(e) === 'ended' || (e.status === 'closed' && DB.me?.role === 'sv')) { s.submittedAt = Math.min(end, e.closesAt || end); s.locked = false; s.away = false; s.flag = s.flag || 'Hệ thống tự nộp khi hết giờ'; s.forcedAt = s.submittedAt; autoGrade(e, s); ch = true; } });
  if (ch) save();
}
function readConnect() { if (!$('#s_sheet')) return; Object.assign(DB.settings, {archiveEmail: $('#s_mail').value.trim(), sheetUrl: $('#s_sheet').value.trim(), token: $('#s_token').value.trim(), judgeUrl: $('#s_judge').value.trim()}); }
function closeInProgress(e) {   // GV đóng đề → bài đang làm dở được nộp với nội dung đã lưu
  DB.subs.forEach(s => { if (s.examId === e.id && !s.submittedAt) { s.submittedAt = Date.now(); s.locked = false; s.away = false; s.flag = s.flag || 'Nộp khi giảng viên đóng đề'; s.forcedAt = s.submittedAt; autoGrade(e, s); } });
}

document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-go],[data-act],[data-role]'); if (!t) return;
  if (t.classList.contains('modal') && ev.target.closest('[data-stop]')) return;
  if (t.dataset.role) { loginRole = t.dataset.role; render(); return; }
  if (t.dataset.go) { S.draft = null; setView(t.dataset.go); return; }
  const A = t.dataset.act, id = t.dataset.id;
  if (t.tagName === 'A') ev.preventDefault();
  const E = id && DB.exams.find(x => x.id === id);
  switch (A) {
    case 'logout': DB.me = null; save(); S.view = ''; render(); break;
    case 'reset': DB = seed(); save(); Object.assign(S, {repExams:null, gradeExam:null, subId:null}); closeModal(); render(); toast('Đã khôi phục dữ liệu mẫu.'); break;
    case 'goSec': switchSection(id); setView(t.dataset.v); break;
    case 'homeTerm': S.homeTerm = t.dataset.v; render(); break;
    case 'svTab': S.svTab = t.dataset.v; render(); break;
    case 'svCourse': S.svCourse = t.dataset.v; render(); break;
    case 'examScope': S.examScope = t.dataset.v; render(); break;
    case 'repScope': S.repScope = t.dataset.v; render(); break;
    // ---- Đề thi ----
    case 'newExam': S.draft = newDraft(); setView('editor'); break;
    case 'editExam': S.draft = JSON.parse(JSON.stringify(E)); S.draft.preamble = parseExam(E.source).preamble; S.draft.target ??= examMax(E); setView('editor'); break;
    case 'dupExam': { const c = JSON.parse(JSON.stringify(E)); Object.assign(c, {id: uid('e'), title: E.title + ' (bản sao)', status:'draft', opensAt:null, sectionIds:[SEC().id], assigned:[...SEC().students], pick:false});
      c.questions.forEach(q => q.id = uid('q')); DB.exams.unshift(c); save(); S.draft = c; S.draft.preamble = parseExam(c.source).preamble; setView('editor'); toast('Đã nhân bản đề, mặc định giao cho lớp ' + SEC().cls + '.'); break; }
    case 'openNow': { const n = Date.now(); E.opensAt = n; if (!E.closesAt || E.closesAt < n + E.duration * 6e4) E.closesAt = n + E.duration * 6e4; save(); render(); toast('Đã mở đề ngay bây giờ.'); break; }
    case 'reopen': { E.status = 'open'; const n = Date.now(); if (E.closesAt && E.closesAt <= n) E.closesAt = n + E.duration * 6e4; save(); render(); toast('Đã mở lại đề' + (E.closesAt ? ` đến ${dt(E.closesAt)}.` : '.')); break; }
    case 'setStatus': E.status = t.dataset.v; if (E.status === 'closed') closeInProgress(E); if (E.status === 'open' && !E.opensAt) E.opensAt = Date.now(); save(); render(); toast(E.status === 'open' ? 'Đã giao bài.' : 'Đã đóng đề.'); break;
    case 'distEqual': case 'distScale': { if (!S.draft.questions.length) { toast('Đề chưa có câu nào.'); break; }
      if (!S.draft.target) S.draft.target = +$('#d_target').value || 10;
      distribute(S.draft, A === 'distEqual' ? 'equal' : 'scale'); S.draft.source = serialize(S.draft); $('#d_src').value = S.draft.source; refreshPreview();
      toast(A === 'distEqual' ? `Đã chia đều ${fmt(S.draft.target)} điểm cho ${S.draft.questions.length} câu.` : `Đã co giãn điểm các câu về tổng ${fmt(S.draft.target)}.`); break; }
    case 'normalize': S.draft.source = serialize(S.draft); $('#d_src').value = S.draft.source; toast('Đã chuẩn hóa theo quy ước “##”.'); break;
    case 'saveExam': {
      readDraftMeta(); const d = S.draft;
      if (!d.title) { toast('Cần đặt tên đề.'); $('#d_title').focus(); break; }
      if (t.dataset.v === 'open') {
        const iss = examIssues(d.questions, COURSE(d.courseId)); if (iss.length) { toast('Còn ' + iss.length + ' lỗi trong đề, chưa thể giao bài.'); break; }
        if (!d.assigned.length) { toast('Chưa chọn lớp hoặc sinh viên nhận đề.'); break; } }
      d.source = serialize(d);
      // Hình thức để mặc định "Thi viết" mà đề không có câu tự luận → suy ra từ loại câu
      const types = new Set(d.questions.map(q => isCode(q.type) ? 'TH' : q.type));
      if (d.kind === 'TL' && !types.has('TL') && types.size === 1) d.kind = [...types][0];
      const rec = {id: d.id || uid('e'), courseId: d.courseId, sectionIds: d.sectionIds, title: d.title, kind: d.kind, component: d.component, duration: d.duration, note: d.note,
        source: d.source, questions: d.questions, assigned: d.assigned, pick: d.pick, proctor: d.proctor, closesAt: d.closesAt || null,
        cat: d.cat, countClo: d.countClo, target: d.target ?? null,
        status: t.dataset.v === 'open' ? 'open' : (d.status || 'draft'), opensAt: t.dataset.v === 'open' ? (d.opensAt || Date.now()) : d.opensAt};
      if (rec.status === 'open' && !rec.closesAt) rec.closesAt = rec.opensAt + rec.duration * 6e4;
      if (rec.closesAt && rec.opensAt && rec.closesAt <= rec.opensAt) { toast('Giờ đóng phải sau giờ mở.'); break; }
      const i = DB.exams.findIndex(x => x.id === rec.id); if (i >= 0) DB.exams[i] = rec; else DB.exams.unshift(rec);
      save(); S.draft = null; setView('exams'); toast(t.dataset.v === 'open' ? `Đã giao bài cho ${rec.assigned.length} sinh viên.` : 'Đã lưu nháp.'); break; }
    // ---- Chấm ----
    case 'pickGrade': S.gradeExam = id; S.subId = null; render(); break;
    case 'closeSub': S.subId = null; render(); break;
    case 'openSub': { const sub = DB.subs.find(s => s.id === id); S.gradeExam = sub.examId; S.subId = id; setView('grade'); break; }
    case 'startOral': { const sub = {id: uid('s'), examId: S.gradeExam, svId: t.dataset.sv, startedAt: Date.now(), submittedAt: Date.now(), answers:{}, scores:{}, feedback:{}, graded:false};
      DB.subs.push(sub); save(); S.subId = sub.id; render(); break; }
    case 'saveGrade': case 'nextSub': {
      const sub = DB.subs.find(s => s.id === id), e = DB.exams.find(x => x.id === sub.examId), sec = SEC();
      document.querySelectorAll('[data-score]').forEach(inp => { const q = e.questions.find(x => x.id === inp.dataset.score);
        if (inp.value === '') delete sub.scores[q.id]; else sub.scores[q.id] = Math.max(0, Math.min(q.max, +inp.value)); });
      document.querySelectorAll('[data-fb]').forEach(inp => { sub.feedback[inp.dataset.fb] = inp.value; });
      sub.graded = !pendingQs(e, sub).length; save();
      if (A === 'nextSub') { const list = DB.subs.filter(s => s.examId === e.id && s.submittedAt && sec.students.includes(s.svId));
        const nx = list.find(s => s.id !== sub.id && pendingQs(e, s).length) || list[(list.indexOf(sub) + 1) % list.length]; S.subId = nx?.id; }
      render(); toast('Đã lưu điểm.'); break; }
    case 'rerun': { const sub = DB.subs.find(s => s.id === t.dataset.sub), e = DB.exams.find(x => x.id === sub.examId), q = e.questions.find(x => x.id === t.dataset.q);
      t.disabled = true; t.textContent = 'Đang chạy…';
      try { const r = await gradeCode(q, sub.answers[q.id]); sub.runs = sub.runs || {}; sub.runs[q.id] = r; sub.scores[q.id] = round25(q.max * sum(r) / r.length); save(); render(); toast(`Đạt ${sum(r)}/${r.length} test.`); }
      catch (err) { t.disabled = false; t.textContent = 'Chạy lại test'; toast('Không kết nối được bộ chấm. Hãy nhập điểm thủ công.'); } break; }
    // ---- Xuất ----
    case 'exportExam': { const sec = SEC(), tb = examTable(E, sec); download(`diem_${slug(CUR().code)}_${slug(sec.cls)}_${slug(E.title)}.csv`, csv([tb.header, ...tb.rows])); break; }
    case 'exportRep': { const tb = repTable(); download(tb.name + '.csv', csv([tb.header, ...tb.rows])); break; }
    case 'syncSheet': { const tb = repTable(); if (!await pushSheet(tb.name, tb)) break;
      const {secs} = repContext();
      for (const sec of secs) for (const e of DB.exams.filter(x => S.repExams.includes(x.id) && x.sectionIds.includes(sec.id))) await pushSheet(`${CUR().code}_${sec.cls}_${e.title}`.slice(0, 95), examTable(e, sec));
      break; }
    case 'pingSheet': { readConnect(); const o = $('#pingOut'); o.textContent = 'Đang kiểm tra…';
      try { const r = await fetch(DB.settings.sheetUrl + '?action=ping&token=' + encodeURIComponent(DB.settings.token || '')); const j = await r.json();
        o.textContent = j.ok ? `Kết nối được · ${j.sheet} · phiên bản ${j.version}` : 'Lỗi: ' + j.error; }
      catch (e) { o.textContent = 'Không kết nối được: kiểm tra URL, quyền “Bất kỳ ai” khi triển khai, và mạng.'; } break; }
    case 'syncAll': { readConnect(); const o = $('#pingOut'); o.textContent = 'Đang đồng bộ…';
      try { const r = await gas({action:'state', state: stateForSync()}); DB.settings.lastSync = Date.now(); save();
        o.textContent = r.blind ? 'Đã gửi (trình duyệt không cho đọc phản hồi; kiểm tra trên Sheet).' : `Đã đồng bộ: ${r.counts ? Object.entries(r.counts).map(([k, v]) => v + ' ' + k).join(', ') : 'xong'}.`; }
      catch (e) { o.textContent = 'Không đồng bộ được: ' + e.message; } break; }
    case 'exportJson': download('khaothi-clo.json', JSON.stringify(DB, null, 1), 'application/json'); break;

      if (!DB.sections.some(x => x.id === DB.me.secId)) DB.me.secId = mySections()[0]?.id;

        <div class="stack" style="gap:6px">${P.mode === 'free'
          ? `<span>• Được dùng tài liệu, công cụ hỗ trợ, dán chữ, ảnh và link.</span><span>• Bài tự lưu; có thể về danh sách bài rồi quay lại làm tiếp trước khi hết thời gian.</span>`

             <span>• Được rời tối đa <b>${P.maxLeaves} lần</b>; rời quá số lần này bài tự động nộp.</span>
             ${P.lockOnReturn ? '<span>• Mỗi lần quay lại, bài bị khóa đến khi giảng viên mở; thời gian vẫn tiếp tục tính.</span>' : ''}

<script>

function sketchUI() {

            <label class="row" style="gap:4px">Nhãn<input class="in sko" style="width:150px" id="sk_labels" value="${esc(SK.labels)}"></label><span class="hint">Kéo chuột để đặt biểu đồ.</span>`,
    text:  `<input class="in sko" id="sk_text" style="width:240px" placeholder="Gõ nội dung rồi bấm vào bảng vẽ" value="${esc(SK.text)}">
            <select class="in sko" id="sk_size" style="width:auto">${[14,18,20,26,34].map(z => `<option ${z === SK.size ? 'selected' : ''}>${z}</option>`).join('')}</select>`,

  const A = ex ? ansObj(getSub(ex).answers[SK.qid]) : {text:''};
  return `<div class="skgrid ${SK.showQ === false ? 'noq' : ''}">
   ${q ? `<aside class="skq" aria-label="Đề bài"><div class="row" style="justify-content:space-between"><b>${esc(q.label)}</b><span class="chip c-plain num">${fmt(q.max)} điểm</span></div>

     ${A.text ? `<details><summary class="hint" style="cursor:pointer;font-weight:700">Phần chữ đã gõ</summary><div class="qbody" style="padding:6px 0;font-size:13px">${esc(A.text)}</div></details>` : ''}</aside>` : ''}
   <div class="stack sk" style="min-width:0">

      <label class="row" style="gap:4px"><input type="checkbox" class="sko" id="sk_fill" ${SK.fill ? 'checked' : ''}> Tô nền</label>

      ${ctx}
    </div>
    <div class="skwrap" id="skwrap"><canvas id="skc" width="960" height="${SK.h}"></canvas></div>
    <div class="row" style="justify-content:space-between"><span class="hint num" id="skSize">Khung 960 × ${SK.h} px · vẽ sát mép dưới khung tự kéo dài</span>
      <div class="row"><button class="btn sm ghost" data-skact="taller">Kéo dài khung xuống ↓</button><button class="btn sm ghost" data-skact="fit">Thu khung vừa hình vẽ</button></div></div>
    <div class="row" style="justify-content:space-between">
      <div class="row"><button class="btn sm ghost" data-skact="undo">Hoàn tác</button><button class="btn sm ghost" data-skact="redo">Làm lại</button><button class="btn sm ghost" data-skact="clear">Xóa hết</button></div>
      <div class="row"><button class="btn ghost" data-act="closeModal">Hủy</button><button class="btn mint" data-skact="insert">${SK.idx != null ? 'Cập nhật hình' : 'Chèn vào bài làm'}</button></div>
    </div></div></div>`;
}
function readSkOpts() {
  const v = id => $('#' + id)?.value;
  SK.w = +(v('sk_w') || SK.w); SK.fill = $('#sk_fill')?.checked ?? SK.fill; SK.grid = $('#sk_grid')?.checked ?? SK.grid;
  if ($('#sk_rows')) { SK.rows = Math.max(1, Math.min(20, +v('sk_rows') || 1)); SK.cols = Math.max(1, Math.min(12, +v('sk_cols') || 1)); }
  if ($('#sk_ctype')) { SK.ctype = v('sk_ctype'); SK.data = v('sk_data'); SK.labels = v('sk_labels'); }
  if ($('#sk_text')) { SK.text = v('sk_text'); SK.size = +v('sk_size'); }
}
function rerenderSketch() { readSkOpts(); $('[data-stop]').innerHTML = sketchUI(); bindSketch(); drawSketch(); }

const nums = s => String(s).split(/[,;\s]+/).map(x => parseFloat(x.replace(',', '.'))).filter(x => !isNaN(x));
const box = s => ({x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2), w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1)});
function drawShape(g, s) {
  g.save(); g.strokeStyle = s.c; g.fillStyle = s.c; g.lineWidth = s.w; g.lineCap = 'round'; g.lineJoin = 'round';
  const {x, y, w, h} = s.x1 != null ? box(s) : {};
  const fillStroke = () => { if (s.fill) { g.globalAlpha = .22; g.fill(); g.globalAlpha = 1; } g.stroke(); };
  const font = z => `${z}px 'Be Vietnam Pro', system-ui, sans-serif`;
  switch (s.t) {
    case 'pen': g.beginPath(); s.pts.forEach(([a, b], i) => i ? g.lineTo(a, b) : g.moveTo(a, b)); if (s.pts.length === 1) g.lineTo(s.pts[0][0] + .1, s.pts[0][1]); g.stroke(); break;
    case 'point': g.beginPath(); g.arc(s.x, s.y, Math.max(3, s.w * 1.3), 0, 7); g.fill(); break;
    case 'line': case 'arrow': {
      g.beginPath(); g.moveTo(s.x1, s.y1); g.lineTo(s.x2, s.y2); g.stroke();
      if (s.t === 'arrow') { const an = Math.atan2(s.y2 - s.y1, s.x2 - s.x1), L = 10 + s.w * 2.5;
        g.beginPath(); g.moveTo(s.x2, s.y2); g.lineTo(s.x2 - L * Math.cos(an - .45), s.y2 - L * Math.sin(an - .45)); g.lineTo(s.x2 - L * Math.cos(an + .45), s.y2 - L * Math.sin(an + .45)); g.closePath(); g.fill(); }
      break; }
    case 'rect': g.beginPath(); g.rect(x, y, w, h); fillStroke(); break;
    case 'ellipse': g.beginPath(); g.ellipse(x + w / 2, y + h / 2, Math.max(1, w / 2), Math.max(1, h / 2), 0, 0, Math.PI * 2); fillStroke(); break;
    case 'tri': g.beginPath(); g.moveTo(x + w / 2, y); g.lineTo(x + w, y + h); g.lineTo(x, y + h); g.closePath(); fillStroke(); break;
    case 'table': {
      g.lineWidth = Math.min(s.w, 3);
      if (s.fill) { g.globalAlpha = .18; g.fillRect(x, y, w, h / s.rows); g.globalAlpha = 1; }
      g.strokeRect(x, y, w, h);
      for (let i = 1; i < s.rows; i++) { g.beginPath(); g.moveTo(x, y + h * i / s.rows); g.lineTo(x + w, y + h * i / s.rows); g.stroke(); }
      for (let j = 1; j < s.cols; j++) { g.beginPath(); g.moveTo(x + w * j / s.cols, y); g.lineTo(x + w * j / s.cols, y + h); g.stroke(); }
      break; }
    case 'chart': {
      const d = nums(s.data), lb = String(s.labels).split(/[,;]/).map(t => t.trim()), n = Math.max(1, d.length);
      const pl = 34, pb = 26, pt = 18, ax = x + pl, ay = y + h - pb, cw = w - pl - 6, ch = h - pb - pt;
      const mx = Math.max(1, ...d), ink = '#1E1B3A';
      g.strokeStyle = ink; g.fillStyle = ink; g.lineWidth = 1.5; g.font = font(12);
      g.beginPath(); g.moveTo(ax, y + pt - 6); g.lineTo(ax, ay); g.lineTo(ax + cw, ay); g.stroke();
      for (let k = 0; k <= 4; k++) { const v = mx * k / 4, yy = ay - ch * k / 4;
        g.globalAlpha = .15; g.beginPath(); g.moveTo(ax, yy); g.lineTo(ax + cw, yy); g.stroke(); g.globalAlpha = 1;
        g.textAlign = 'right'; g.textBaseline = 'middle'; g.fillText(+v.toFixed(1), ax - 5, yy); }
      g.textAlign = 'center'; g.textBaseline = 'top';
      const step = cw / n, pts = d.map((v, i) => [ax + step * (i + .5), ay - ch * v / mx]);
      d.forEach((v, i) => {
        g.fillStyle = ink; g.fillText(lb[i] ?? String(i + 1), pts[i][0], ay + 5);
        if (s.ctype === 'bar') { g.fillStyle = s.c; g.globalAlpha = .75; g.fillRect(pts[i][0] - step * .3, pts[i][1], step * .6, ay - pts[i][1]); g.globalAlpha = 1; g.strokeStyle = ink; g.strokeRect(pts[i][0] - step * .3, pts[i][1], step * .6, ay - pts[i][1]); }
        g.fillStyle = ink; g.textBaseline = 'bottom'; g.fillText(v, pts[i][0], pts[i][1] - (s.ctype === 'bar' ? 3 : 8)); g.textBaseline = 'top';
      });
      if (s.ctype === 'line' && d.length) { g.strokeStyle = s.c; g.lineWidth = Math.max(2, s.w); g.beginPath(); pts.forEach(([a, b], i) => i ? g.lineTo(a, b) : g.moveTo(a, b)); g.stroke();
        g.fillStyle = s.c; pts.forEach(([a, b]) => { g.beginPath(); g.arc(a, b, 4.5, 0, 7); g.fill(); }); }
      break; }
    case 'text': g.font = font(s.size); g.textBaseline = 'top'; String(s.s).split('\n').forEach((ln, i) => g.fillText(ln, s.x, s.y + i * s.size * 1.25)); break;
  }
  g.restore();
}
function shapeBox(s, g) {
  if (s.t === 'pen') { const xs = s.pts.map(p => p[0]), ys = s.pts.map(p => p[1]); return {x: Math.min(...xs) - 6, y: Math.min(...ys) - 6, w: Math.max(...xs) - Math.min(...xs) + 12, h: Math.max(...ys) - Math.min(...ys) + 12}; }

function fileToImg(file) {

    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');

      im.onerror = rej; im.src = r.result; };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

}
async function submitExam(auto, why) {
  const e = DB.exams.find(x => x.id === S.svExam); if (!e) return; const sub = getSub(e);
  if (sub.submittedAt) return;
  sub.submittedAt = Math.min(Date.now(), deadline(e, sub)); sub.locked = false; sub.away = false;
  if (why === 'leave') sub.flag = `Tự động nộp: rời trình duyệt ${sub.leaves.length} lần (cho phép ${P_(e).maxLeaves})`;
  autoGrade(e, sub); save();
  closeModal(); SK = null; S.svExam = null; setView('myresults');
  toast(why === 'leave' ? 'Bạn đã rời trình duyệt quá số lần cho phép, bài đã được tự động nộp.' : auto ? 'Hết giờ, hệ thống đã tự nộp bài.' : 'Đã nộp bài.');
  const code = e.questions.filter(q => isCode(q.type) && q.tests.length);
  if (code.length) {
    sub.runs = sub.runs || {};
    for (const q of code) {
      try { const r = await gradeCode(q, sub.answers[q.id]); sub.runs[q.id] = r; sub.scores[q.id] = round25(q.max * sum(r) / r.length); }
      catch (err) { /* không kết nối được bộ chấm → để GV chấm */ }
    }
    sub.graded = !pendingQs(e, sub).length; save(); if (S.view === 'myresults') render();
  }
}

/* ---------- Rời trình duyệt → khóa (chỉ chế độ giám sát) ---------- */
let blurTimer = null;
function registerLeave(how) {
  const c = activeTake(); if (!c || !strict(c.e)) return; const {e, sub} = c;
  if (sub.away) return;
  (sub.leaves ||= []).push({at: Date.now(), how}); sub.away = true; save();
  if (sub.leaves.length > P_(e).maxLeaves) submitExam(true, 'leave');
}
function registerReturn() {
  const c = activeTake(); if (!c || !strict(c.e)) return; const {e, sub} = c;
  if (!sub.away) return;
  sub.away = false; const L = sub.leaves.at(-1); L.back = Date.now();
  if (P_(e).lockOnReturn) sub.locked = true; else { L.unlockedAt = Date.now(); L.auto = true; }
  save(); render();
}
document.addEventListener('visibilitychange', () => {
  if (S.picking) return;
  if (document.hidden) { clearTimeout(blurTimer); registerLeave('đổi tab / thu nhỏ'); } else registerReturn();
});
window.addEventListener('blur', () => {
  if (S.picking || !activeTake()) return; clearTimeout(blurTimer);
  blurTimer = setTimeout(() => { if (!document.hasFocus() && !S.picking) registerLeave('chuyển sang ứng dụng khác'); }, 1500);
});
window.addEventListener('focus', () => { clearTimeout(blurTimer); if (S.picking) { setTimeout(() => { S.picking = false; }, 400); return; } registerReturn(); });

/* ---------- Dán: ảnh, link; chữ bị chặn ở chế độ giám sát ---------- */
async function addImages(e, sub, qid, files) {
  const q = e.questions.find(x => x.id === qid);
  if (!q || q.type !== 'TL') { toast('Chỉ câu tự luận mới nhận ảnh.'); return; }
  if (!P_(e).allowImage) { toast('Đề này không cho phép dán hoặc tải ảnh.'); return; }
  const A = ansObj(sub.answers[qid]);
  for (const f of files) { try { A.imgs.push({kind:'paste', src: await fileToImg(f), at: Date.now()}); } catch (err) { toast('Không đọc được ảnh ' + (f.name || '')); } }
  sub.answers[qid] = A; save(); render(); toast(`Đã thêm ${files.length} ảnh vào ${q.label}.`);
}
function addLinks(e, sub, qid, text) {
  const q = e.questions.find(x => x.id === qid); if (!q || !['TL','LINK'].includes(q.type)) return false;
  const parts = String(text).trim().split(/\s+/).filter(Boolean);
  if (!parts.length || !parts.every(isUrl)) return false;
  const A = ansObj(sub.answers[qid]);
  parts.forEach(u => { if (!A.links.some(l => l.url === u)) A.links.push({url: u, at: Date.now()}); });
  sub.answers[qid] = A; save(); render(); toast(`Đã thêm ${parts.length} link vào ${q.label}.`); return true;
}
const curQid = e => (takeQs(e)[S.curQ] || takeQs(e)[0]).id;
document.addEventListener('paste', ev => {
  const c = curTake(); if (!c) return;
  const {e, sub} = c; if (sub.locked || sub.submittedAt) { ev.preventDefault(); return; }
  const files = [...(ev.clipboardData?.items || [])].filter(i => i.kind === 'file' && i.type.startsWith('image/')).map(i => i.getAsFile()).filter(Boolean);
  const text = ev.clipboardData?.getData('text/plain') || '';
  if (files.length) { ev.preventDefault(); if (SK) { toast('Đóng bảng vẽ trước khi dán ảnh.'); return; } addImages(e, sub, curQid(e), files); return; }
  if (ev.target.dataset?.linkIn) { ev.preventDefault(); if (!addLinks(e, sub, ev.target.dataset.linkIn, text)) toast('Ô này chỉ nhận đường link bắt đầu bằng http:// hoặc https://'); return; }
  if (!strict(e)) return;                       // chế độ tự do: dán chữ bình thường
  ev.preventDefault();
  if (isUrl(text) && ['TL','LINK'].includes(e.questions.find(x => x.id === curQid(e))?.type)) { addLinks(e, sub, curQid(e), text); return; }
  sub.pasteBlocked = (sub.pasteBlocked || 0) + 1; save(); toast('Không được dán chữ vào bài làm. Link thì dán vào ô “Đính kèm link”.');
}, true);
document.addEventListener('beforeinput', ev => { const c = curTake(); if (c && strict(c.e) && /^insertFrom(Paste|Drop|PasteAsQuotation)/.test(ev.inputType)) ev.preventDefault(); }, true);
document.addEventListener('dragover', ev => { if (curTake()) ev.preventDefault(); });
document.addEventListener('drop', ev => {
  const c = curTake(); if (!c) return;
  const files = [...(ev.dataTransfer?.files || [])].filter(f => f.type.startsWith('image/'));
  if (!files.length) { if (strict(c.e)) { ev.preventDefault(); toast('Chỉ kéo thả được ảnh.'); } return; }
  ev.preventDefault(); if (c.sub.locked) return;
  addImages(c.e, c.sub, curQid(c.e), files);
});
document.addEventListener('change', ev => {
  if (ev.target.id !== 'imgUp') return; S.picking = false;
  const c = curTake(); if (c && ev.target.files.length) addImages(c.e, c.sub, ev.target.dataset.q, [...ev.target.files]);
});
document.addEventListener('input', ev => {
  const t = ev.target; if (!t.dataset.ansText) return;
  const c = curTake(); if (!c || c.sub.submittedAt || c.sub.locked) return;
  const A = ansObj(c.sub.answers[t.dataset.ansText]); A.text = t.value; c.sub.answers[t.dataset.ansText] = A; save();
  const w = $('#wc'); if (w) w.textContent = `${(t.value.match(/\S+/g) || []).length} từ · đã lưu`;
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.dataset?.linkIn) { ev.preventDefault(); $(`[data-act=addLink][data-q="${ev.target.dataset.linkIn}"]`)?.click(); } });
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t) return;
  const A = t.dataset.act;
  if (A === 'pickImg') S.picking = true;
  const c = curTake(); if (!c) return;
  const {e, sub} = c;
  if (A === 'sketch') openSketch(t.dataset.q);
  if (A === 'editDraw') openSketch(t.dataset.q, +t.dataset.i);
  if (A === 'viewImg') lightbox(ansObj(sub.answers[t.dataset.q]).imgs[+t.dataset.i].src);
  if (A === 'delImg') { const a = ansObj(sub.answers[t.dataset.q]); a.imgs.splice(+t.dataset.i, 1); sub.answers[t.dataset.q] = a; save(); render(); }
  if (A === 'addLink') { const v = $('#linkIn')?.value || ''; if (!addLinks(e, sub, t.dataset.q, v)) toast('Đường link chưa hợp lệ (cần bắt đầu bằng http:// hoặc https://).'); }
  if (A === 'delLink') { const a = ansObj(sub.answers[t.dataset.q]); a.links.splice(+t.dataset.i, 1); sub.answers[t.dataset.q] = a; save(); render(); }
});
</script>
<script>
/* ---------- Đồng bộ giữa các tab (bản xem trước) ----------
   Khi triển khai: thay bằng hỏi máy chủ định kỳ vài giây một lần. */
window.addEventListener('storage', ev => {
  if (ev.key !== KEY || !DB?.me) return;
  const me = DB.me, fresh = load(); if (!fresh) return; DB = fresh; DB.me = me;
  if (S.view === 'take') { const c = curTake(); if (c && `${c.sub.locked}|${c.sub.submittedAt}|${c.sub.extraMin}` !== S.lockSig) { if (c.sub.submittedAt) setView('myresults'); else render(); } }
  else if (['monitor','home'].includes(S.view) || (S.view === 'grade' && !S.subId)) render();
});
function afterRender() {
  if (S.view === 'monitor') S.timer = setInterval(() => { const me = DB.me, f = load(); if (f) { DB = f; DB.me = me; } const m = $('.main'); if (m && S.view === 'monitor' && document.activeElement?.id !== 'monQ') m.innerHTML = gvMonitor(); }, 3000);
}

/* ================== GV · GIÁM SÁT THI ================== */
function lockedIn(sec) {
  return DB.subs.filter(s => s.locked && !s.submittedAt && sec.students.includes(s.svId) && DB.exams.find(e => e.id === s.examId)?.sectionIds.includes(sec.id));
}
/* Giám sát: nhiều bài cùng lúc → trang tổng quan gọn (mỗi bài một dòng, bài có SV bị khóa lên đầu),
   bấm vào một bài để xem chi tiết từng SV (lọc theo trạng thái, tìm theo tên/MSSV). */
const monState = sub => !sub ? 'none' : sub.submittedAt ? 'done' : sub.locked ? 'locked' : sub.away ? 'away' : 'doing';
const MST = {locked:['Đang bị khóa','c-bad'], away:['Đang ở ngoài','c-peach'], doing:['Đang làm','c-mint'], none:['Chưa vào','c-plain'], done:['Đã nộp','c-grape']};
function monStats(e, sec) {
  const ids = sec ? inSec(e, sec) : e.assigned;
  const c = {locked:0, away:0, doing:0, none:0, done:0};
  ids.forEach(id => c[monState(DB.subs.find(s => s.examId === e.id && s.svId === id))]++);
  return {c, n: ids.length};
}
function monRow(x, all) {
  const {e, sc, c, n} = x, tone = courseTone(e.courseId), left = e.closesAt ? e.closesAt - Date.now() : null;
  const ago = ms => ms > 864e5 ? Math.round(ms / 864e5) + ' ngày' : ms > 36e5 ? Math.round(ms / 36e5) + ' giờ' : fmtLeft(ms);
  return `<button class="svrow monrow" data-act="monOpen" data-id="${e.id}" data-sec="${sc.id}" style="--tone:var(--${tone})">
    <span class="ctag" style="background:var(--${tone}-s)">${esc(sc.cls)}</span>
    <div class="svmain"><b>${esc(e.title)}</b><span class="hint">${esc(COURSE(e.courseId).name)} · ${examLabel(e)} · ${strict(e) ? 'giám sát' : 'tự do'}${left != null ? ` · đóng sau ${ago(left)}` : ''}</span></div>
    <div class="stackbar" title="${c.done} nộp · ${c.doing + c.away} đang làm · ${c.locked} khóa · ${c.none} chưa vào">${[['done','grape'],['doing','mint'],['away','peach'],['locked','bad']].map(([k, col]) => c[k] ? `<i style="flex:${c[k]};background:var(--${col})"></i>` : '').join('')}<i style="flex:${c.none || (n ? 0 : 1)};background:var(--sunk)"></i></div>
    <span class="num hint" style="min-width:110px;text-align:right">${c.doing + c.away + c.locked} đang làm · ${c.done}/${n} nộp</span>
    ${c.locked ? `<span class="chip c-bad num attn-bad">${c.locked} khóa</span>` : c.away ? `<span class="chip c-peach num">${c.away} ở ngoài</span>` : '<span style="min-width:62px"></span>'}
  </button>`;
}
function gvMonitor() {
  const sec = SEC(), all = S.monScope !== 'sec';
  const secs = all ? mySections() : [sec];
  const live = secs.flatMap(sc => secExams(sc).filter(isLive).map(e => ({e, sc, ...monStats(e, sc)})));
  const cur = S.monExam && live.find(x => x.e.id === S.monExam && x.sc.id === (S.monSec || sec.id));
  if (cur) return monDetail(cur);
  S.monExam = null;
  // Đang thi: đề thi đang mở, hoặc bất kỳ bài nào đang có SV làm/bị khóa; Bài tập đang mở: phần còn lại
  const active = x => x.c.doing + x.c.away + x.c.locked > 0;
  const now = live.filter(x => examCat(x.e) === 'thi' || active(x)).sort((a, b) => b.c.locked - a.c.locked || (b.c.doing + b.c.away) - (a.c.doing + a.c.away) || (a.e.closesAt || 9e15) - (b.e.closesAt || 9e15));
  const hw = live.filter(x => !now.includes(x)).sort((a, b) => (a.e.closesAt || 9e15) - (b.e.closesAt || 9e15));
  const soon = secs.flatMap(sc => secExams(sc).filter(e => phase(e) === 'scheduled' && e.opensAt - Date.now() < 7 * 864e5).map(e => ({e, sc}))).sort((a, b) => a.e.opensAt - b.e.opensAt);
  const tot = k => sum(now.map(x => x.c[k]));
  const until = ts => { const m = ts - Date.now(); return m > 864e5 ? `sau ${Math.round(m / 864e5)} ngày` : m > 36e5 ? `sau ${Math.round(m / 36e5)} giờ` : `sau ${Math.max(1, Math.round(m / 6e4))} phút`; };
  return `
  ${pageHead('Giám sát', 'Phòng thi trực tuyến', `${now.length} bài đang thi · ${soon.length} bài sắp thi · ${hw.length} bài tập đang mở`,
    `<button class="btn pri ${tot('locked') ? 'attn-bad' : ''}" data-act="unlockEvery" ${tot('locked') ? '' : 'disabled'}>Mở khóa tất cả (${tot('locked')})</button>`)}
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div class="tabs"><button class="${all ? 'on' : ''}" data-act="monScope" data-v="all">Tất cả lớp của tôi</button><button class="${!all ? 'on' : ''}" data-act="monScope" data-v="sec">Chỉ lớp ${esc(sec.cls)}</button></div>
    <span class="hint">Tự cập nhật mỗi 3 giây · bấm một dòng để xem từng sinh viên</span>
  </div>
  <div class="monsum">
    ${[['locked','Bị khóa, chờ mở'],['away','Đang ở ngoài'],['doing','Đang làm'],['done','Đã nộp (bài đang thi)']].map(([k, t]) => `<div class="${k === 'locked' && tot(k) ? 'hot' : ''}" style="--b:var(--${{locked:'bad',away:'peach',doing:'mint',done:'grape'}[k]}-s)"><b class="num">${tot(k)}</b><span>${t}</span></div>`).join('')}
  </div>
  <h3 class="mh ${now.length ? 'live-h' : ''}"><i style="background:var(--bad)"></i>Đang thi <span class="hint">${now.length}</span></h3>
  ${now.length ? `<div class="svlist">${now.map(x => monRow(x, all)).join('')}</div>` : '<div class="empty">Không có lớp nào đang thi.</div>'}
  <h3 class="mh"><i style="background:var(--sky)"></i>Sắp thi <span class="hint">7 ngày tới · ${soon.length}</span></h3>
  ${soon.length ? `<div class="svlist">${soon.map(({e, sc}) => { const tone = courseTone(e.courseId); return `<div class="svrow" style="--tone:var(--${tone})">
      <span class="ctag" style="background:var(--${tone}-s)">${esc(sc.cls)}</span>
      <div class="svmain"><b>${esc(e.title)}</b><span class="hint">${esc(COURSE(e.courseId).name)} · ${examLabel(e)} · ${durText(e.duration)} · ${inSec(e, sc).length} SV</span></div>
      <span class="due num" style="color:var(--sky);font-weight:700;min-width:150px">${sdt(e.opensAt)} · ${until(e.opensAt)}</span>
      <button class="btn sm ghost" data-act="openNowMon" data-id="${e.id}">Mở ngay</button></div>`; }).join('')}</div>` : '<div class="empty">Không có bài nào sắp mở trong 7 ngày tới.</div>'}
  <h3 class="mh"><i style="background:var(--mint)"></i>Bài tập đang mở <span class="hint">${hw.length} · chưa có SV đang làm</span></h3>
  ${hw.length ? `<div class="svlist">${hw.map(x => monRow(x, all)).join('')}</div>` : '<div class="empty">Không có bài tập nào đang mở.</div>'}`;
}
function monDetail({e, sc}) {
  const P = P_(e), qs = takeQs(e), f = S.monF || 'all', q = (S.monQ || '').toLowerCase();
  const rowsAll = inSec(e, sc).map(id => ({st: DB.students.find(s => s.id === id), sub: DB.subs.find(s => s.examId === e.id && s.svId === id)})).filter(r => r.st);
  const order = ['locked','away','doing','none','done'];
  rowsAll.sort((a, b) => order.indexOf(monState(a.sub)) - order.indexOf(monState(b.sub)) || a.st.name.split(' ').pop().localeCompare(b.st.name.split(' ').pop(), 'vi'));
  const cnt = k => rowsAll.filter(r => monState(r.sub) === k).length;
  const rows = rowsAll.filter(r => (f === 'all' || monState(r.sub) === f) && (!q || r.st.name.toLowerCase().includes(q) || r.st.id.toLowerCase().includes(q)));
  return `
  <div class="row" style="margin-bottom:10px"><button class="btn sm ghost" data-act="monBack">← Tất cả bài đang mở</button></div>
  ${pageHead(`Giám sát · Lớp ${esc(sc.cls)}`, esc(e.title), `${esc(COURSE(e.courseId).name)} · ${examLabel(e)} · ${durText(e.duration)} · ${P.mode === 'free' ? 'chế độ tự do' : `giám sát: rời tối đa ${P.maxLeaves} lần${P.lockOnReturn ? ', khóa khi quay lại' : ''}`}${e.closesAt ? ` · đóng lúc ${dt(e.closesAt)}` : ''}`,
    `<button class="btn pri ${cnt('locked') ? 'attn-bad' : ''}" data-act="unlockAll" ${cnt('locked') ? '' : 'disabled'}>Mở khóa cả lớp (${cnt('locked')})</button><button class="btn ghost" data-act="addTimeAll">+5 phút cả lớp</button>`)}
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div class="tabs">${[['all','Tất cả', rowsAll.length], ...order.map(k => [k, MST[k][0], cnt(k)])].map(([k, t, n]) => `<button class="${f === k ? 'on' : ''}" data-act="monF" data-v="${k}">${t} <span class="num">${n}</span></button>`).join('')}</div>
    <input class="in" id="monQ" style="max-width:240px" placeholder="Tìm tên hoặc MSSV…" value="${esc(S.monQ || '')}">
  </div>
  <div class="tw"><table class="compact">
    <thead><tr><th>Sinh viên</th><th>Trạng thái</th><th class="c">Tiến độ</th><th>Rời trình duyệt</th><th class="c">Chặn dán</th><th class="c">Ảnh/link</th><th class="c">Còn lại</th><th></th></tr></thead>
    <tbody>${rows.map(({st, sub}) => { const k = monState(sub), L = sub?.leaves || [];
      const att = sub?._nAtt != null ? sub._nAtt : sub ? sum(qs.map(qq => { const v = sub.answers[qq.id]; return v && typeof v === 'object' ? (v.imgs?.length || 0) + (v.links?.length || 0) : 0; })) : 0;
      return `<tr class="${k === 'locked' ? 'locked' : ''}">
        <td><b>${esc(st.name)}</b> <span class="hint num">${st.id}</span>${sub?.flag ? `<div class="hint" style="color:var(--bad)">${esc(sub.flag)}</div>` : ''}</td>
        <td><span class="chip ${MST[k][1]}">${MST[k][0]}</span></td>
        <td class="c num">${sub ? `${qs.filter(x => hasAns(sub.answers[x.id])).length}/${qs.length}` : '–'}</td>
        <td>${P.mode === 'free' ? '<span class="hint">tự do</span>' : `<span class="chip ${L.length >= P.maxLeaves ? 'c-bad' : L.length ? 'c-peach' : 'c-plain'} num">${L.length}/${P.maxLeaves}</span> <span class="hint num">${L.map(l => hm(l.at) + (l.unlockedAt ? '✓' : l.back ? '·khóa' : '·ngoài')).join(' · ')}</span>`}</td>
        <td class="c num">${sub?.pasteBlocked || 0}</td><td class="c num">${att}</td>
        <td class="c num">${sub && !sub.submittedAt ? fmtLeft(Math.max(0, deadline(e, sub) - Date.now())) + (sub.extraMin ? ` <span class="hint">+${sub.extraMin}′</span>` : '') : '–'}</td>
        <td class="r"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap">
          ${k === 'locked' ? `<button class="btn sm pri attn-bad" data-act="unlock" data-id="${sub.id}">Mở khóa</button>` : ''}
          ${sub && !sub.submittedAt ? `<button class="btn sm ghost" data-act="addTime" data-id="${sub.id}">+5′</button>` : ''}
          ${sub?.submittedAt ? `<button class="btn sm ghost" data-act="openSub" data-id="${sub.id}">Xem bài</button>` : ''}
        </div></td></tr>`; }).join('') || '<tr><td colspan="8" class="hint">Không có sinh viên phù hợp.</td></tr>'}</tbody></table></div>`;
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if (!t || DB.me?.role !== 'gv') return;
  const A = t.dataset.act, sub = t.dataset.id && DB.subs.find(s => s.id === t.dataset.id);
  const unlock = s => { s.locked = false; const L = s.leaves?.at(-1); if (L) { L.unlockedAt = Date.now(); L.unlockedBy = DB.me.name; } };
  if (A === 'monOpen') { S.monExam = t.dataset.id; S.monSec = t.dataset.sec; S.monF = 'all'; S.monQ = ''; render(); }
  if (A === 'monBack') { S.monExam = null; render(); }
  if (A === 'monScope') { S.monScope = t.dataset.v; S.monExam = null; render(); }
  if (A === 'openNowMon') { const e = DB.exams.find(x => x.id === t.dataset.id), n = Date.now(); e.opensAt = n; if (!e.closesAt || e.closesAt < n + e.duration * 6e4) e.closesAt = n + e.duration * 6e4; save(); render(); toast('Đã mở đề ngay.'); }
  if (A === 'monFilter') { S.monFilter = t.dataset.v; render(); }
  if (A === 'monF') { S.monF = t.dataset.v; render(); }
  if (A === 'unlockEvery') { const secs = S.monScope !== 'sec' ? mySections() : [SEC()]; const list = DB.subs.filter(s => s.locked && !s.submittedAt && secs.some(sc => sc.students.includes(s.svId) && DB.exams.find(e => e.id === s.examId)?.sectionIds.includes(sc.id)));
    list.forEach(unlock); save(); render(); toast(`Đã mở khóa ${list.length} sinh viên.`); }
  if (A === 'gvImg') { const sb = DB.subs.find(x => x.id === t.dataset.sub), im = ansObj(sb.answers[t.dataset.q]).imgs[+t.dataset.i];
    lightbox(im.src, `${stName(sb.svId)} · ${im.kind === 'draw' ? 'Hình vẽ trên bảng vẽ' : 'Ảnh dán'}${im.at ? ' lúc ' + hm(im.at) : ''}`); }
  if (A === 'unlock' && sub) { unlock(sub); save(); render(); toast(`Đã mở khóa cho ${stName(sub.svId)}.`); }
  if (A === 'unlockAll') { const sc = DB.sections.find(x => x.id === S.monSec) || SEC(); const list = lockedIn(sc).filter(s => s.examId === S.monExam); list.forEach(unlock); save(); render(); toast(`Đã mở khóa ${list.length} sinh viên.`); }
  if (A === 'addTime' && sub) { sub.extraMin = (sub.extraMin || 0) + 5; save(); render(); toast(`Đã cộng 5 phút cho ${stName(sub.svId)}.`); }
  if (A === 'addTimeAll') { const e = DB.exams.find(x => x.id === S.monExam), sc = DB.sections.find(x => x.id === S.monSec) || SEC(); const list = DB.subs.filter(s => s.examId === e.id && !s.submittedAt && sc.students.includes(s.svId));
    list.forEach(s => s.extraMin = (s.extraMin || 0) + 5); save(); render(); toast(`Đã cộng 5 phút cho ${list.length} sinh viên đang làm.`); }
});
</script>
<script>
/* ================== LƯU TRỮ LỚP HỌC PHẦN ==================
   Đóng gói (ZIP) toàn bộ kết quả: báo cáo CLO theo Mẫu 2, bảng điểm, đề, bài làm (chữ, ảnh, hình vẽ, link) và dữ liệu gốc.
   Lớp đã lưu trữ được ẩn khỏi danh sách đang dạy, nằm riêng ở mục Lưu trữ, khôi phục được bất kỳ lúc nào. */

// ---- Bộ tạo ZIP tối giản (lưu thẳng, không nén – ảnh vốn đã nén) ----
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
function makeZip(files) {           // files: [{name, data: Uint8Array | string}]
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, dosT, 2], [12, dosD, 2], [14, crc, 4], [18, data.length, 4], [22, data.length, 4], [26, name.length, 2], [28, 0, 2]]
      .forEach(([o, v, n]) => n === 4 ? h.setUint32(o, v, true) : h.setUint16(o, v, true));
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, dosT, 2], [14, dosD, 2], [16, crc, 4], [20, data.length, 4], [24, data.length, 4], [28, name.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]]
      .forEach(([o, v, n]) => n === 4 ? c.setUint32(o, v, true) : c.setUint16(o, v, true));
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + data.length;
  }
  const cSize = central.reduce((n, a) => n + a.length, 0), e = new DataView(new ArrayBuffer(22));
  [[0, 0x06054b50, 4], [8, files.length, 2], [10, files.length, 2], [12, cSize, 4], [16, off, 4]].forEach(([o, v, n]) => n === 4 ? e.setUint32(o, v, true) : e.setUint16(o, v, true));
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type: 'application/zip'});
}
const dataUrlBytes = u => { const b = atob(u.split(',')[1]); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; };
const safe = s => slug(String(s)).slice(0, 60) || 'x';

// Báo cáo CLO dạng trang HTML độc lập (dùng lại đúng bố cục Mẫu 2 đang hiển thị)
function reportPage(sec) {
  const keep = {secId: DB.me.secId, repScope: S.repScope, repExams: S.repExams, repKey: S.repKey};
  DB.me.secId = sec.id; S.repScope = 'sec'; S.repExams = secExams(sec).filter(e => e.status !== 'draft').map(e => e.id); S.repKey = `${sec.id}|sec`;
  const html = gvReport();
  Object.assign(S, {repScope: keep.repScope, repExams: keep.repExams, repKey: keep.repKey}); DB.me.secId = keep.secId;
  const paper = new DOMParser().parseFromString(html, 'text/html').querySelector('.paper');
  paper.querySelectorAll('a').forEach(a => a.replaceWith(a.textContent));
  paper.querySelectorAll('textarea').forEach(t => { const p = document.createElement('p'); p.textContent = t.value || t.textContent; t.replaceWith(p); });
  const css = document.querySelector('style').textContent;
  return `<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Báo cáo CLO ${esc(COURSE(sec.courseId).code)} ${esc(sec.cls)}</title><style>${css}</style></head><body style="padding:24px;background:#fff">${paper.outerHTML}</body></html>`;
}

function buildPackage(secIds) {
  const files = [], now = new Date();
  const secs = secIds.map(id => DB.sections.find(s => s.id === id));
  const root = secs.length === 1 ? `LuuTru_${safe(COURSE(secs[0].courseId).code)}_${safe(secs[0].cls)}_HK${secs[0].semester}_${secs[0].year}` : `LuuTru_${safe(COURSE(secs[0].courseId).code)}_${secs.length}lop_${now.toISOString().slice(0, 10)}`;
  let nImg = 0, nSub = 0;
  secs.forEach(sec => {
    const C = COURSE(sec.courseId), base = secs.length === 1 ? root : `${root}/${safe(sec.cls)}_HK${sec.semester}_${sec.year}`;
    const exams = secExams(sec).filter(e => e.status !== 'draft');
    files.push({name: `${base}/BaoCao_CLO_${safe(sec.cls)}.html`, data: reportPage(sec)});
    const R = cloReport(C, exams.map(e => e.id), sec.students);
    files.push({name: `${base}/BaoCao_CLO_${safe(sec.cls)}.csv`, data: '﻿' + csv([['STT','Mã SV','Họ và tên', ...R.clos.map(c => `${c.id} (/${fmt1(c.max)})`), 'Số CLO chưa đạt'],
      ...R.rows.map((r, i) => [i + 1, r.s.id, r.s.name, ...R.clos.map(c => r.sc[c.id]), r.fail]), ['', '', 'Tỷ lệ SV đạt CLO', ...R.clos.map(c => pct(c.rate)), '']])});
    exams.forEach(e => {
      const tb = examTable(e, sec), eDir = `${base}/De_${safe(e.title)}`;
      files.push({name: `${eDir}/BangDiem.csv`, data: '﻿' + csv([tb.header, ...tb.rows])});
      files.push({name: `${eDir}/NoiDungDe.txt`, data: e.source});
      inSec(e, sec).forEach(id => {
        const sub = DB.subs.find(s => s.examId === e.id && s.svId === id); if (!sub?.submittedAt) return; nSub++;
        const sDir = `${eDir}/BaiLam/${id}_${safe(stName(id))}`; let txt = `${stName(id)} (${id}) – nộp ${dt(sub.submittedAt)}\n`;
        if (sub.leaves?.length) txt += `Rời trình duyệt ${sub.leaves.length} lần: ${sub.leaves.map(l => hm(l.at)).join(', ')}\n`;
        if (sub.flag) txt += sub.flag + '\n';
        e.questions.forEach((q, qi) => {
          const v = sub.answers?.[q.id], A = ansObj(v), tag = `Cau${qi + 1}_${safe(q.label)}`;
          txt += `\n=== ${q.label} [${q.clo}] – điểm ${sub.scores?.[q.id] ?? 'chưa chấm'}/${q.max} ===\n`;
          if (typeof v === 'string') txt += v + '\n';
          if (A.text && typeof v !== 'string') txt += A.text + '\n';
          A.links.forEach(l => txt += `Link: ${l.url}\n`);
          A.imgs.filter(im => im.src).forEach((im, k) => { const ext = im.src.startsWith('data:image/png') ? 'png' : 'jpg', fn = `${tag}_${im.kind === 'draw' ? 'hinhve' : 'anh'}${k + 1}.${ext}`;
            files.push({name: `${sDir}/${fn}`, data: dataUrlBytes(im.src)}); txt += `Ảnh: ${fn}\n`; nImg++; });
          if (sub.feedback?.[q.id]) txt += `Nhận xét GV: ${sub.feedback[q.id]}\n`;
        });
        files.push({name: `${sDir}/BaiLam.txt`, data: txt});
      });
    });
    const data = {course: C, section: sec, students: sec.students.map(id => DB.students.find(s => s.id === id)), exams, subs: DB.subs.filter(s => exams.some(e => e.id === s.examId) && sec.students.includes(s.svId))};
    files.push({name: `${base}/DuLieuGoc.json`, data: JSON.stringify(data, null, 1)});
  });
  files.unshift({name: `${root}/DocTruoc.txt`, data:
`Gói lưu trữ kết quả học phần – tạo lúc ${now.toLocaleString('vi-VN')} bởi ${DB.me.name}
${secs.map(s => `• ${COURSE(s.courseId).name} (mã ${COURSE(s.courseId).code}) – lớp ${s.cls} – HK${s.semester} ${s.year} – ${s.students.length} SV`).join('\n')}

Nội dung: báo cáo CLO theo Mẫu 2 (.html mở bằng trình duyệt, .csv mở bằng Excel), bảng điểm từng đề, nội dung đề,
bài làm từng sinh viên (chữ, ${nImg} ảnh/hình vẽ, link) – ${nSub} bài nộp, và DuLieuGoc.json để khôi phục khi cần.`});
  return {blob: makeZip(files), name: root + '.zip', nImg, nSub, nFiles: files.length};
}
const blobToB64 = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result.split(',')[1]); f.readAsDataURL(b); });
function saveBlob(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
async function mailPackage(pkg, email) {
  if (!DB.settings.sheetUrl) return 'nourl';
  if (pkg.blob.size > 24e6) return 'big';
  try { await gas({action:'mailArchive', email, filename: pkg.name, zip: await blobToB64(pkg.blob), subject: `[Khảo thí CLO] ${pkg.name}`}); return 'sent'; }
  catch (e) { return 'fail'; }
}

function archiveModal(courseId, preset) {
  const C = COURSE(courseId), secs = mySections().filter(s => s.courseId === courseId).sort(termSort);
  modal(`<div class="stack"><span class="eyebrow">Lưu trữ kết quả học phần</span><h2>${esc(C.name)}</h2>
    <p class="hint">Chọn các lớp cần lưu trữ. Hệ thống đóng gói toàn bộ kết quả thành một tệp ZIP, gửi về email (nếu đã nối Google Sheet/Apps Script) và tải về máy; sau đó các lớp được chuyển vào mục Lưu trữ.</p>
    <div class="stack" style="gap:6px">${secs.map(s => { const open = secExams(s).filter(isLive).length, pend = pendingOf(s).length; return `
      <label class="row archrow"><input type="checkbox" class="archPick" value="${s.id}" ${preset ? (preset === s.id ? 'checked' : '') : (open ? '' : 'checked')}>
        <b>${esc(s.cls)}</b><span class="hint">${esc(termKey(s))} · ${s.students.length} SV · ${secExams(s).length} đề</span>
        ${open ? `<span class="chip c-lemon">${open} đề đang mở</span>` : ''}${pend ? `<span class="chip c-sky">${pend} bài chờ chấm</span>` : ''}</label>`; }).join('') || '<span class="hint">Không có lớp đang hoạt động.</span>'}</div>
    <label class="f">Gửi gói lưu trữ tới email<input class="in" id="archMail" type="email" value="${esc(DB.settings.archiveEmail || '')}"></label>
    <label class="row" style="gap:6px"><input type="checkbox" id="archClose" checked> Đóng các đề còn mở của lớp trước khi lưu trữ</label>
    <div class="row"><button class="btn pri" data-act="doArchive">Đóng gói và lưu trữ</button><button class="btn ghost" data-act="closeModal">Hủy</button></div></div>`, true);
}

function gvArchive() {
  const arch = allMySections().filter(s => s.archived).sort(termSort);
  const years = [...new Set(arch.map(s => s.year))];
  const yf = S.archYear && years.includes(S.archYear) ? S.archYear : 'all';
  const list = arch.filter(s => yf === 'all' || s.year === yf);
  const byCourse = {}; list.forEach(s => (byCourse[s.courseId] ||= []).push(s));
  return `
  ${pageHead('Hồ sơ các học kỳ trước', 'Lưu trữ', `${arch.length} lớp học phần đã lưu trữ. Lớp lưu trữ không hiện trong danh sách đang dạy nhưng vẫn xem lại, tải lại gói và khôi phục được.`)}
  ${years.length > 1 ? `<div class="tabs" style="margin-bottom:14px"><button class="${yf === 'all' ? 'on' : ''}" data-act="archYear" data-v="all">Tất cả năm học</button>${years.map(y => `<button class="${yf === y ? 'on' : ''}" data-act="archYear" data-v="${y}">${y}</button>`).join('')}</div>` : ''}
  ${Object.entries(byCourse).map(([cid, ss]) => { const C = COURSE(cid); return `
    <div class="card stack" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><div><span class="eyebrow">Mã HP ${esc(C.code)}</span><h3>${esc(C.name)}</h3></div></div>
    <div class="tw"><table><thead><tr><th>Lớp</th><th>Học kỳ</th><th class="c">SV</th><th class="c">Đề</th><th>Lưu trữ</th><th></th></tr></thead><tbody>
      ${ss.map(s => `<tr><td><b>${esc(s.cls)}</b></td><td>${esc(termKey(s))}</td><td class="c num">${s.students.length}</td><td class="c num">${secExams(s).length}</td><td class="hint">${dt(s.archived.at)}${s.archived.mailedTo ? ` · đã gửi ${esc(s.archived.mailedTo)}` : ''}</td>
        <td class="r"><div class="row" style="justify-content:flex-end;flex-wrap:nowrap"><button class="btn sm" data-act="goSec" data-id="${s.id}" data-v="report">Xem báo cáo</button><button class="btn sm ghost" data-act="dlArchive" data-id="${s.id}">Tải gói ZIP</button><button class="btn sm ghost" data-act="unarchive" data-id="${s.id}">Khôi phục</button></div></td></tr>`).join('')}
    </tbody></table></div></div>`; }).join('') || '<div class="empty">Chưa có lớp nào được lưu trữ. Vào “Học phần & lớp”, bấm “Lưu trữ…” ở học phần đã kết thúc.</div>'}`;
}

document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t || DB.me?.role !== 'gv') return;
  const A = t.dataset.act, id = t.dataset.id;
  if (A === 'archiveCourse') archiveModal(id);
  if (A === 'archiveSec') archiveModal(DB.sections.find(s => s.id === id).courseId, id);
  if (A === 'archYear') { S.archYear = t.dataset.v; render(); }
  if (A === 'doArchive') {
    const ids = [...document.querySelectorAll('.archPick:checked')].map(x => x.value); if (!ids.length) { toast('Chưa chọn lớp nào.'); return; }
    const email = $('#archMail').value.trim(); DB.settings.archiveEmail = email;
    if ($('#archClose').checked) DB.exams.forEach(e => { if (!isDone(e) && e.status !== 'draft' && e.sectionIds.some(x => ids.includes(x))) { e.status = 'closed'; closeInProgress(e); } });
    t.disabled = true; t.textContent = 'Đang đóng gói…'; await new Promise(r => setTimeout(r, 30));
    const pkg = buildPackage(ids); saveBlob(pkg.blob, pkg.name);
    const r = email ? await mailPackage(pkg, email) : 'noemail';
    ids.forEach(x => { const s = DB.sections.find(y => y.id === x); s.archived = {at: Date.now(), by: DB.me.name, file: pkg.name, mailedTo: r === 'sent' ? email : null}; });
    if (ids.includes(DB.me.secId)) DB.me.secId = mySections()[0]?.id;
    save(); closeModal(); setView('archive');
    const mb = pkg.blob.size > 1048576 ? (pkg.blob.size / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(pkg.blob.size / 1024)) + ' KB';
    toast({sent:`Đã lưu trữ ${ids.length} lớp, gói ${mb} đã tải về và gửi tới ${email}.`, nourl:`Đã lưu trữ ${ids.length} lớp và tải gói ${mb} về máy. Chưa gửi email: cần nối Apps Script ở “Kết nối & dữ liệu”.`,
           big:`Đã lưu trữ và tải gói về máy. Gói ${mb} vượt giới hạn đính kèm email 25 MB, hãy tải lên Drive.`, fail:'Đã lưu trữ và tải gói về máy, nhưng gửi email lỗi.', noemail:`Đã lưu trữ ${ids.length} lớp và tải gói về máy.`}[r]);
  }
  if (A === 'dlArchive') { const pkg = buildPackage([id]); saveBlob(pkg.blob, pkg.name); toast(`Đã tạo lại gói ${pkg.name}.`); }
  if (A === 'unarchive') { const s = DB.sections.find(x => x.id === id); delete s.archived; save(); render(); toast(`Đã khôi phục lớp ${s.cls} vào danh sách đang dạy.`); }
});
</script>
<script>
/* ================== SOẠN ĐỀ: loại, khung giờ, thời lượng nhanh ================== */
function syncSchedule(fromDur) {
  if (!S.draft || !$('#d_open')) return;
  const op = fromLocalInput($('#d_open').value), dur = Math.max(1, +$('#d_dur').value || 1);
  if (op && (!S.draft._closeManual || fromDur)) { $('#d_close').value = toLocalInput(op + dur * 6e4); S.draft._closeManual = false; }
  document.querySelectorAll('[data-act=durPreset]').forEach(b => { b.classList.toggle('lemon', +b.dataset.v === dur); b.classList.toggle('ghost', +b.dataset.v !== dur); });
  $('#schedHint').textContent = schedHint({opensAt: op, closesAt: fromLocalInput($('#d_close').value), duration: dur});
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act=durPreset]'); if (!t) return;
  $('#d_dur').value = t.dataset.v; syncSchedule(true);
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'd_dur') syncSchedule(true);
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'd_open') syncSchedule(false);
  if (t.id === 'd_close') { S.draft._closeManual = true; syncSchedule(false); }
  if (t.name === 'd_kind') { t.closest('.seg').querySelectorAll('label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked)); readDraftMeta(); refreshPreview(); }
  if (t.name === 'd_cat') {
    t.closest('.seg').querySelectorAll('label').forEach(l => l.classList.toggle('on', l.querySelector('input').checked));
    const bt = t.value === 'bt';
    $('#thiKinds').hidden = bt; $('#btClo').hidden = !bt;
    $('#catHint').textContent = bt ? 'Bài tập được trộn mọi loại câu (tự luận, trắc nghiệm, thực hành, nộp link…).' : 'Đề thi theo một hình thức; luôn được tính vào CLO.';
    const m = document.querySelector(`[name=p_mode][value=${bt ? 'free' : 'strict'}]`); if (m) { m.checked = true; m.dispatchEvent(new Event('change', {bubbles: true})); }
    if (bt && +$('#d_dur').value <= 120) { $('#d_dur').value = 10080; syncSchedule(true); }
    readDraftMeta(); refreshPreview();
  }
});
</script>
<script>
/* ================== NHẬP DANH SÁCH SINH VIÊN TỪ EXCEL ==================
   Đọc đúng mẫu "BIỂU MẪU NHẬP ĐIỂM QUÁ TRÌNH" của Khoa (thư mục Drive theo lớp, tên tệp <HọcPhần>_<Lớp>.xls):
   – Đầu trang: KHOA / MÔN: "<Tên học phần>_<Lớp>" / LỚP / HỌC KỲ
   – Hàng tiêu đề: STT · MSSV · HỌ ĐỆM · TÊN · (1)…(6) · TBM · THI… ; cột cuối là lớp sinh hoạt (vd DCT25A, DCT23A với SV học lại)
   – MSSV 12 chữ số; ô lưu dạng số bị mất số 0 đầu sẽ được bù lại.
   Nhận nhiều tệp một lúc; mỗi tệp tự ghép vào lớp học phần tương ứng (học phần + lớp), chưa có thì tạo mới. */

function parseRosterRows(fileName, rows) {

  const split = s => { const m = String(s).match(/^(.*?)[_\-\s]+([A-Z]{2,5}\d{2}[A-Z0-9]?)$/i); return m ? [m[1].trim(), m[2].toUpperCase()] : [String(s).trim(), '']; };

  data.forEach(r => {
    const id = fixId(r[cId]); if (seen.has(id)) { warn.push(`MSSV ${id} lặp lại`); return; } seen.add(id);
    const name = (cFull >= 0 ? String(r[cFull]) : `${cHo >= 0 ? r[cHo] : ''} ${cTen >= 0 ? r[cTen] : ''}`).replace(/\s+/g, ' ').trim();
    students.push({id, name, cls: cCls >= 0 ? String(r[cCls]).trim() || cls : cls, padded: typeof r[cId] === 'number' && String(Math.round(r[cId])).length === 11});

    let g = ''; for (let j = c; j >= 0; j--) { const t = nz(grpRow[j]); if (t.startsWith('heso')) { g = t.replace('heso', ''); break; } }

async function readRosterFile(file) {
  const buf = await file.arrayBuffer();

  const r = parseRosterRows(file.name, XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: ''}));
  if (r.error) return r;

  r.slots.forEach(sl => sl.hidden = !!hidden[sl.col]);

}

  const k = nz(name); if (!k) return null;

function xlsFill(bytes, values /* {row: {col: number}} */) {

    const first = {}; while (i < out.length && out[i].t !== 0x00D7) { if (CELL.has(out[i].t)) { const rn = rowOf(out[i]); if (!(rn in first)) first[rn] = out[i]; } i++; }
    if (i >= out.length) break;
    const db = out[i], v = new DataView(db.b.buffer, db.b.byteOffset);
    v.setUint32(4, db.o - rows[0].o, true);
    let prev = null;
    rows.forEach((rw, k) => { const fc = first[rowOf(rw)]; if (!fc) return;
      const off = k === 0 ? fc.o - (rows[1] ? rows[1].o : rw.o + rw.b.length) : fc.o - prev.o;
      if (4 + 4 + k * 2 + 2 <= db.b.length) v.setUint16(8 + k * 2, off, true); prev = fc; });
  }
  const idx = out.find(x => x.t === 0x020B);
  if (idx) { const v = new DataView(idx.b.buffer, idx.b.byteOffset), dbs = out.filter(x => x.t === 0x00D7), dc = out.find(x => x.t === 0x0055);
    if (dc) v.setUint32(16, dc.o, true); dbs.forEach((x, k) => { if (20 + k * 4 + 4 <= idx.b.length) v.setUint32(20 + k * 4, x.o, true); }); }
  // 3. Ghép lại luồng Workbook; dời BOUNDSHEET của các trang sau (nếu có)
  const nb = new Uint8Array(pos + after.length); nb.set(before, 0); let p = before.length; out.forEach(x => { nb.set(x.b, p); p += x.b.length; }); nb.set(after, p);
  const delta = nb.length - d.length, sheetBof = recs[sStart].o, nv = new DataView(nb.buffer);
  if (delta) recs.slice(0, sStart).forEach(r => { if (r.t === 0x0085) { const lb = nv.getUint32(r.o + 4, true); if (lb > sheetBof) nv.setUint32(r.o + 4, lb + delta, true); } });
  ent.content = nb; ent.size = nb.length;
  return {bytes: CFB.write(cfb, {type: 'array', fileType: 'cfb'}), filled};
}

<script>
/* ================== XUẤT ĐIỂM QUÁ TRÌNH VÀO TỆP .XLS CỦA TRƯỜNG ==================
   Dùng chính tệp đã nhập danh sách (giữ làm mẫu ở lớp học phần). GV chọn đề nào điền vào cột nào của
   HỆ SỐ 1 / HỆ SỐ 2; điểm quy về thang 10. Không ghi điểm thi (THI1, THI2) và các cột phần mềm trường tự tính. */
const slotName = sl => `Hệ số ${sl.grp} · cột (${sl.n})`;
function exportPlan(sec) {
  const t = sec.template, P = S.exp;
  const exams = secExams(sec).filter(e => e.component !== 'CK' && !['draft','scheduled'].includes(phase(e)));
  if (!P.map) {                                  // gợi ý mặc định: bài tập → Hệ số 1, kiểm tra/thi quá trình → Hệ số 2 (chỉ các cột đang hiện)
    P.map = {};
    const vis = g => t.slots.filter(sl => sl.grp === g && !sl.hidden);
    const bt = exams.filter(e => examCat(e) === 'bt'), thi = exams.filter(e => examCat(e) === 'thi');
    vis('1').forEach((sl, i) => { if (bt[i]) P.map[sl.col] = bt[i].id; });
    vis('2').forEach((sl, i) => { if (thi[i]) P.map[sl.col] = thi[i].id; });
  }
  const step = +P.round, rnd = x => Math.round(x / step) * step;
  const score = (e, id) => { const sub = DB.subs.find(s => s.examId === e.id && s.svId === id);
    if (!sub?.submittedAt) return P.missing === 'zero' ? 0 : null;
    if (pendingQs(e, sub).length) return null;
    return +rnd(subTotal(e, sub) / examMax(e) * 10).toFixed(2); };
  const cols = t.slots.filter(sl => P.map[sl.col]);
  const rows = Object.entries(t.rowMap).map(([id, row]) => ({id, row, st: DB.students.find(s => s.id === id), inSec: sec.students.includes(id)}));
  const values = {}; let pending = 0;
  rows.forEach(r => { values[r.row] = {}; cols.forEach(sl => { const e = DB.exams.find(x => x.id === P.map[sl.col]); if (!e || !r.inSec) return;
    const sub = DB.subs.find(s => s.examId === e.id && s.svId === r.id); if (sub?.submittedAt && pendingQs(e, sub).length) pending++;
    values[r.row][sl.col] = score(e, r.id); }); });
  const notInFile = sec.students.filter(id => !(id in t.rowMap));
  return {exams, cols, rows, values, notInFile, pending};
}
function exportModal() {
  const sec = SEC();
  if (!sec.template) { modal(`<div class="stack"><h2>Chưa có tệp mẫu của lớp ${esc(sec.cls)}</h2>
    <p>Điểm quá trình được điền vào đúng tệp .xls mà phần mềm của trường xuất ra. Hãy nhập danh sách lớp bằng tệp đó (ví dụ <b>Toanroirac_${esc(sec.cls)}.xls</b>); hệ thống sẽ giữ tệp làm mẫu.</p>
    <div class="row"><button class="btn pri" data-act="importXls">Nhập tệp .xls của trường</button><button class="btn ghost" data-act="closeModal">Đóng</button></div></div>`); return; }
  S.exp = {map: null, round: '0.1', missing: 'zero'}; modal(exportUI(), 'xwide');
}
function exportUI() {
  const sec = SEC(), t = sec.template, P = S.exp, plan = exportPlan(sec);
  const opt = col => [`<option value="">— để trống —</option>`, ...plan.exams.map(e => `<option value="${e.id}" ${P.map[col] === e.id ? 'selected' : ''}>${esc(e.title)} (${examLabel(e)})</option>`)].join('');
  const slotRow = sl => `<label class="slot ${sl.hidden ? 'hid' : ''}"><span><b>${slotName(sl)}</b>${sl.hidden ? ' <span class="hint">(cột đang ẩn trong mẫu)</span>' : ''}</span><select class="in expMap" data-col="${sl.col}">${opt(sl.col)}</select></label>`;
  const vis = t.slots.filter(sl => !sl.hidden), hid = t.slots.filter(sl => sl.hidden);
  return `<div class="stack"><span class="eyebrow">Lớp ${esc(sec.cls)} · ${esc(CUR().name)}</span><h2>Xuất điểm quá trình vào tệp của trường</h2>
    <p class="hint">Mẫu: <b>${esc(t.name)}</b> (nhập lúc ${dt(t.importedAt)}). Tệp tải về giữ nguyên định dạng, chỉ điền các ô điểm Hệ số 1, Hệ số 2; không ghi điểm thi (THI1, THI2) và các cột TBM, TKM, Đ.CHỮ, Đ.SỐ. Điểm quy về thang 10.</p>
    <div class="slots">${vis.map(slotRow).join('')}</div>
    ${hid.length ? `<details><summary class="hint" style="cursor:pointer;font-weight:700">Các cột đang ẩn trong mẫu (${hid.length})</summary><div class="slots" style="margin-top:8px">${hid.map(slotRow).join('')}</div></details>` : ''}
    <div class="row" style="gap:18px">
      <label class="row" style="gap:6px">Làm tròn <select class="in" id="expRound" style="width:auto">${[['0.1','0,1'],['0.25','0,25'],['0.5','0,5']].map(([v, l]) => `<option value="${v}" ${P.round === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="row" style="gap:6px">Bài không nộp <select class="in" id="expMissing" style="width:auto"><option value="zero" ${P.missing === 'zero' ? 'selected' : ''}>ghi 0</option><option value="blank" ${P.missing === 'blank' ? 'selected' : ''}>để trống</option></select></label>
    </div>
    ${plan.pending ? `<span class="chip c-lemon" style="white-space:normal">${plan.pending} bài còn câu chờ chấm sẽ để trống – nên chấm xong trước khi xuất.</span>` : ''}
    ${plan.notInFile.length ? `<span class="chip c-peach" style="white-space:normal">${plan.notInFile.length} SV có trên hệ thống nhưng không có trong tệp mẫu (không xuất được): ${plan.notInFile.slice(0, 5).map(esc).join(', ')}${plan.notInFile.length > 5 ? '…' : ''}</span>` : ''}
    <div class="tw" style="max-height:42vh;overflow:auto"><table class="compact"><thead><tr><th class="c">STT</th><th>MSSV</th><th>Họ và tên</th>${plan.cols.map(sl => `<th class="c">HS${sl.grp} (${sl.n})</th>`).join('')}</tr></thead><tbody>
      ${plan.rows.map((r, i) => `<tr ${r.inSec ? '' : 'style="opacity:.55"'}><td class="c num">${i + 1}</td><td class="num">${esc(r.id)}</td><td>${esc(r.st?.name || '(chưa có trên hệ thống)')}</td>
        ${plan.cols.map(sl => { const v = plan.values[r.row]?.[sl.col]; return `<td class="c num">${v == null ? '<span class="faint">–</span>' : fmt(v)}</td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>
    <div class="row"><button class="btn pri" data-act="expDo" ${plan.cols.length ? '' : 'disabled'}>Tải tệp ${esc(t.name)}</button><button class="btn ghost" data-act="closeModal">Đóng</button></div></div>`;
}
document.addEventListener('change', ev => {
  const t = ev.target; if (!S.exp || !$('#expRound')) return;
  if (t.classList.contains('expMap')) { if (t.value) S.exp.map[t.dataset.col] = t.value; else delete S.exp.map[t.dataset.col]; }
  if (t.id === 'expRound') S.exp.round = t.value;
  if (t.id === 'expMissing') S.exp.missing = t.value;
  if (t.classList.contains('expMap') || t.id === 'expRound' || t.id === 'expMissing') $('[data-stop]').innerHTML = exportUI();
});
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t || DB.me?.role !== 'gv') return;
  if (t.dataset.act === 'exportXls') exportModal();
  if (t.dataset.act === 'expDo') {
    const sec = SEC(), plan = exportPlan(sec);
    try { await loadXLSX();
      const {bytes, filled} = xlsFill(b64ToBytes(sec.template.b64), plan.values);
      const blob = new Blob([bytes], {type: 'application/vnd.ms-excel'}); saveBlob(blob, sec.template.name);
      sec.template.lastExport = {at: Date.now(), map: {...S.exp.map}}; save();
      toast(`Đã điền ${filled} ô điểm vào ${sec.template.name}.`);
    } catch (e) { toast('Không xuất được: ' + e.message); }
  }
});
</script>
<script>
/* Gợi ý nổi cho phần tử có data-tip (CLO): hiện ngay khi rê chuột, đi theo vị trí phần tử */
(() => {
  let tip = null;
  const show = el => { const t = el.dataset.tip; if (!t) return; tip ||= Object.assign(document.createElement('div'), {id: 'tip'}); tip.textContent = t; document.body.appendChild(tip);
    const r = el.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px'; tip.style.top = (r.bottom + h + 12 > innerHeight ? r.top - h - 6 : r.bottom + 6) + 'px'; };
  const hide = () => tip?.remove();
  document.addEventListener('mouseover', ev => { const el = ev.target.closest?.('[data-tip]'); if (el) show(el); else hide(); });
  document.addEventListener('focusin', ev => { const el = ev.target.closest?.('[data-tip]'); if (el) show(el); });
  document.addEventListener('focusout', hide); document.addEventListener('scroll', hide, true);
  // cập nhật gợi ý của ô chọn CLO khi đổi
